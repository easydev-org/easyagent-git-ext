id: gitea
version: 2.0
lifecycle: [deleted]

# gitea-ext: git operations against a repository inside a remote easyworker
# sandbox. Every tool runs `git` IN the sandbox (via the worker Execute RPC),
# so it needs no system git of its own. Each tool takes a `sandbox` (which
# worker) and a `path` (the repository directory in that sandbox); the path
# must be a git repository or the call is rejected.
tools:
  - name: git-clone
    description: >-
      Clone a repository into `path` in the sandbox and return its current branch + HEAD.
    descriptions:
      zh: >-
        将仓库克隆到沙箱内的 `path` 并返回当前分支与 HEAD。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: "Which sandbox to run in (see list-sandboxes). Omit when only one is configured."
          descriptions:
            zh: "在哪个沙箱中运行（见 list-sandboxes）。仅配置一个时可省略。"
        path:
          type: string
          description: "The git repository directory in the sandbox (relative to the workspace root)."
          descriptions:
            zh: "沙箱内 git 仓库目录（相对于工作区根）。"
        remote:
          type: string
          description: "The git URL."
          descriptions:
            zh: "git 地址。"
        branch:
          type: string
          description: "Branch to check out (default the remote default)."
          descriptions:
            zh: "要检出的分支（默认远端默认）。"
        depth:
          type: integer
          description: "Shallow depth (default 1; 0 = full)."
          descriptions:
            zh: "浅克隆深度（默认 1；0 表示完整）。"
      required: [sandbox, path, remote]
    required_config: [sandboxes, servers]
  - name: git-status
    description: >-
      Show the working-tree status of the repo at `path`.
    descriptions:
      zh: >-
        显示 `path` 处仓库的工作区状态。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: "Which sandbox to run in (see list-sandboxes). Omit when only one is configured."
          descriptions:
            zh: "在哪个沙箱中运行（见 list-sandboxes）。仅配置一个时可省略。"
        path:
          type: string
          description: "The git repository directory in the sandbox (relative to the workspace root)."
          descriptions:
            zh: "沙箱内 git 仓库目录（相对于工作区根）。"
      required: [sandbox, path]
    required_config: [sandboxes, servers]
  - name: git-log
    description: >-
      List recent commits of the repo at `path`.
    descriptions:
      zh: >-
        列出 `path` 处仓库的最近提交。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: "Which sandbox to run in (see list-sandboxes). Omit when only one is configured."
          descriptions:
            zh: "在哪个沙箱中运行（见 list-sandboxes）。仅配置一个时可省略。"
        path:
          type: string
          description: "The git repository directory in the sandbox (relative to the workspace root)."
          descriptions:
            zh: "沙箱内 git 仓库目录（相对于工作区根）。"
        limit:
          type: integer
          description: "Max commits (default 20)."
          descriptions:
            zh: "最大提交数（默认 20）。"
      required: [sandbox, path]
    required_config: [sandboxes, servers]
  - name: git-diff
    description: >-
      Show the diff of the repo at `path`.
    descriptions:
      zh: >-
        显示 `path` 处仓库的差异。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: "Which sandbox to run in (see list-sandboxes). Omit when only one is configured."
          descriptions:
            zh: "在哪个沙箱中运行（见 list-sandboxes）。仅配置一个时可省略。"
        path:
          type: string
          description: "The git repository directory in the sandbox (relative to the workspace root)."
          descriptions:
            zh: "沙箱内 git 仓库目录（相对于工作区根）。"
        staged:
          type: boolean
          description: "Diff the staged changes."
          descriptions:
            zh: "比较已暂存的变更。"
        from:
          type: string
          description: "From revision."
          descriptions:
            zh: "起始版本。"
        to:
          type: string
          description: "To revision."
          descriptions:
            zh: "目标版本。"
      required: [sandbox, path]
    required_config: [sandboxes, servers]
  - name: git-branch
    description: >-
      List branches of the repo at `path`.
    descriptions:
      zh: >-
        列出 `path` 处仓库的分支。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: "Which sandbox to run in (see list-sandboxes). Omit when only one is configured."
          descriptions:
            zh: "在哪个沙箱中运行（见 list-sandboxes）。仅配置一个时可省略。"
        path:
          type: string
          description: "The git repository directory in the sandbox (relative to the workspace root)."
          descriptions:
            zh: "沙箱内 git 仓库目录（相对于工作区根）。"
        remoteOnly:
          type: boolean
          description: "List remote-tracking branches."
          descriptions:
            zh: "列出远端跟踪分支。"
      required: [sandbox, path]
    required_config: [sandboxes, servers]
  - name: git-checkout
    description: >-
      Switch to a branch in the repo at `path`.
    descriptions:
      zh: >-
        切换到 `path` 处仓库的某个分支。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: "Which sandbox to run in (see list-sandboxes). Omit when only one is configured."
          descriptions:
            zh: "在哪个沙箱中运行（见 list-sandboxes）。仅配置一个时可省略。"
        path:
          type: string
          description: "The git repository directory in the sandbox (relative to the workspace root)."
          descriptions:
            zh: "沙箱内 git 仓库目录（相对于工作区根）。"
        branch:
          type: string
          description: "Branch name."
          descriptions:
            zh: "分支名。"
        create:
          type: boolean
          description: "Create it if absent."
          descriptions:
            zh: "不存在时创建。"
      required: [sandbox, path, branch]
    required_config: [sandboxes, servers]
  - name: git-add
    description: >-
      Stage paths in the repo at `path` (omit `paths` to stage all).
    descriptions:
      zh: >-
        暂存 `path` 处仓库的路径（省略 `paths` 则暂存全部）。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: "Which sandbox to run in (see list-sandboxes). Omit when only one is configured."
          descriptions:
            zh: "在哪个沙箱中运行（见 list-sandboxes）。仅配置一个时可省略。"
        path:
          type: string
          description: "The git repository directory in the sandbox (relative to the workspace root)."
          descriptions:
            zh: "沙箱内 git 仓库目录（相对于工作区根）。"
        paths:
          type: array
          description: "Paths to stage."
          descriptions:
            zh: "要暂存的路径。"
      required: [sandbox, path]
    required_config: [sandboxes, servers]
  - name: git-commit
    description: >-
      Commit in the repo at `path`.
    descriptions:
      zh: >-
        在 `path` 处仓库提交。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: "Which sandbox to run in (see list-sandboxes). Omit when only one is configured."
          descriptions:
            zh: "在哪个沙箱中运行（见 list-sandboxes）。仅配置一个时可省略。"
        path:
          type: string
          description: "The git repository directory in the sandbox (relative to the workspace root)."
          descriptions:
            zh: "沙箱内 git 仓库目录（相对于工作区根）。"
        message:
          type: string
          description: "Commit message."
          descriptions:
            zh: "提交信息。"
        all:
          type: boolean
          description: "Stage tracked changes first."
          descriptions:
            zh: "先暂存已跟踪文件的变更。"
        author:
          type: string
          description: "Author (Name <email>)."
          descriptions:
            zh: "作者（Name <email>）。"
      required: [sandbox, path, message]
    required_config: [sandboxes, servers]
  - name: git-pull
    description: >-
      Fetch + fast-forward the repo at `path` from origin.
    descriptions:
      zh: >-
        从 origin 拉取并快进 `path` 处仓库。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: "Which sandbox to run in (see list-sandboxes). Omit when only one is configured."
          descriptions:
            zh: "在哪个沙箱中运行（见 list-sandboxes）。仅配置一个时可省略。"
        path:
          type: string
          description: "The git repository directory in the sandbox (relative to the workspace root)."
          descriptions:
            zh: "沙箱内 git 仓库目录（相对于工作区根）。"
      required: [sandbox, path]
    required_config: [sandboxes, servers]
  - name: git-push
    description: >-
      DISABLED. Direct push is refused on purpose: changes reach the remote only
      through review. Calling this returns an error explaining that you must use
      `git-submit-mr` instead (it pushes to an `agent/*` head branch and opens a
      merge request).
    descriptions:
      zh: >-
        已禁用。直接 push 会被拒绝：改动只能通过评审进入远端。调用它会返回错误，
        提示改用 `git-submit-mr`（推到 `agent/*` 临时分支并开 MR）。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: "Which sandbox to run in (see list-sandboxes). Omit when only one is configured."
          descriptions:
            zh: "在哪个沙箱中运行（见 list-sandboxes）。仅配置一个时可省略。"
        path:
          type: string
          description: "The git repository directory in the sandbox (relative to the workspace root)."
          descriptions:
            zh: "沙箱内 git 仓库目录（相对于工作区根）。"
        branch:
          type: string
          description: "Branch to push (default current)."
          descriptions:
            zh: "要推送的分支（默认当前）。"
        force:
          type: boolean
          description: "Force-with-lease push."
          descriptions:
            zh: "强制（force-with-lease）推送。"
      required: [sandbox, path]
    required_config: [sandboxes, servers]
  - name: git-show
    description: >-
      Print a file's content at a revision in the repo at `path`.
    descriptions:
      zh: >-
        输出 `path` 处仓库某版本下某文件的内容。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: "Which sandbox to run in (see list-sandboxes). Omit when only one is configured."
          descriptions:
            zh: "在哪个沙箱中运行（见 list-sandboxes）。仅配置一个时可省略。"
        path:
          type: string
          description: "The git repository directory in the sandbox (relative to the workspace root)."
          descriptions:
            zh: "沙箱内 git 仓库目录（相对于工作区根）。"
        file:
          type: string
          description: "File path in the repo."
          descriptions:
            zh: "仓库内文件路径。"
        rev:
          type: string
          description: "Revision (default HEAD)."
          descriptions:
            zh: "版本（默认 HEAD）。"
      required: [sandbox, path, file]
    required_config: [sandboxes, servers]
  - name: git-remote-ls
    description: >-
      List a REMOTE repository's branches and tags WITHOUT cloning it, straight
      from the forge's API (one request). Use this to answer "which branches
      exist" or "what is the latest commit" before deciding whether to clone.
      Needs no sandbox.
    descriptions:
      zh: >-
        不克隆、直接通过 forge API（一次请求）列出远端仓库的分支与标签。适合回答
        「有哪些分支」「最新提交是哪个」，再决定要不要克隆。无需沙箱。
    input_schema:
      type: object
      properties:
        remote:
          type: string
          description: "Repository URL, e.g. https://git.example.com/owner/repo.git"
          descriptions:
            zh: "仓库地址，如 https://git.example.com/owner/repo.git"
      required: [remote]
    required_config: [servers]
  - name: git-submit-mr
    description: >-
      Submit the current branch for REVIEW: pushes it to a NEW immutable
      `agent/<session>-<timestamp>` head branch and opens a merge request into
      `base`. This is the ONLY way changes reach the remote — `git-push` is
      refused. Commit locally first; an empty difference is rejected.
    descriptions:
      zh: >-
        提交当前分支以供评审：推到一个**新的不可变** `agent/<会话>-<时间戳>` 头分支，
        并向 `base` 开 MR。这是改动进入远端的**唯一**途径——`git-push` 已被拒绝。
        请先在本地 commit；没有差异会被拒绝。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: "Which sandbox to run in (see list-sandboxes). Omit when only one is configured."
          descriptions:
            zh: "在哪个沙箱中运行（见 list-sandboxes）。仅配置一个时可省略。"
        path:
          type: string
          description: "The git repository directory in the sandbox."
          descriptions:
            zh: "沙箱内 git 仓库目录。"
        base:
          type: string
          description: "Target branch (default: the extension's default-branch setting, usually main)."
          descriptions:
            zh: "目标分支（默认：扩展的 default-branch 配置，通常是 main）。"
        title:
          type: string
          description: "Merge request title."
          descriptions:
            zh: "MR 标题。"
        body:
          type: string
          description: "Merge request description (optional)."
          descriptions:
            zh: "MR 描述（可选）。"
      required: [sandbox, path, title]
    required_config: [sandboxes, servers]
  - name: git-mr-list
    description: >-
      List merge requests of a repository (default: the one at `path`, state
      open). Use it to see whether your submission is still open and what a
      reviewer sees.
    descriptions:
      zh: >-
        列出仓库的 MR（默认：`path` 处那个仓库、状态为 open）。用于确认自己提交的 MR
        是否仍未合并。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: "Which sandbox to run in (only needed when `remote` is omitted)."
          descriptions:
            zh: "在哪个沙箱中运行（仅在省略 `remote` 时需要）。"
        path:
          type: string
          description: "The git repository directory in the sandbox (used to derive the remote)."
          descriptions:
            zh: "沙箱内 git 仓库目录（用于推导 remote）。"
        remote:
          type: string
          description: "Repository URL, if you would rather name it directly."
          descriptions:
            zh: "仓库地址（若想直接指定）。"
        state:
          type: string
          description: "\"open\" (default) | \"closed\" | \"all\"."
          descriptions:
            zh: "\"open\"（默认）| \"closed\" | \"all\"。"
      required: []
    required_config: [servers]
  - name: git-mr-show
    description: >-
      Show ONE merge request with its comment thread. Read it after a reviewer
      comments, so a follow-up submission answers what was actually asked.
    descriptions:
      zh: >-
        查看单个 MR 及其评论线程。收到评审意见后先读它，再提交补充改动，避免答非所问。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: "Which sandbox to run in (only needed when `remote` is omitted)."
          descriptions:
            zh: "在哪个沙箱中运行（仅在省略 `remote` 时需要）。"
        path:
          type: string
          description: "The git repository directory in the sandbox (used to derive the remote)."
          descriptions:
            zh: "沙箱内 git 仓库目录（用于推导 remote）。"
        remote:
          type: string
          description: "Repository URL, if you would rather name it directly."
          descriptions:
            zh: "仓库地址（若想直接指定）。"
        index:
          type: integer
          description: "The merge request number."
          descriptions:
            zh: "MR 编号。"
      required: [index]
    required_config: [servers]
  - name: git-mr-comment
    description: >-
      Post a comment on a merge request — answer a reviewer, or explain a choice.
    descriptions:
      zh: >-
        在 MR 上发表评论：回复评审意见或说明取舍。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: "Which sandbox to run in (only needed when `remote` is omitted)."
          descriptions:
            zh: "在哪个沙箱中运行（仅在省略 `remote` 时需要）。"
        path:
          type: string
          description: "The git repository directory in the sandbox (used to derive the remote)."
          descriptions:
            zh: "沙箱内 git 仓库目录（用于推导 remote）。"
        remote:
          type: string
          description: "Repository URL, if you would rather name it directly."
          descriptions:
            zh: "仓库地址（若想直接指定）。"
        index:
          type: integer
          description: "The merge request number."
          descriptions:
            zh: "MR 编号。"
        body:
          type: string
          description: "Comment text (Markdown)."
          descriptions:
            zh: "评论内容（Markdown）。"
      required: [index, body]
    required_config: [servers]
  - name: git-mr-close
    description: >-
      Close a merge request WITHOUT merging (abandon a superseded submission), or
      reopen it with `reopen: true`.
    descriptions:
      zh: >-
        关闭 MR（不合并），用于放弃已被取代的提交；`reopen: true` 可重新打开。
    requires: [mr.close]
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: "Which sandbox to run in (only needed when `remote` is omitted)."
          descriptions:
            zh: "在哪个沙箱中运行（仅在省略 `remote` 时需要）。"
        path:
          type: string
          description: "The git repository directory in the sandbox (used to derive the remote)."
          descriptions:
            zh: "沙箱内 git 仓库目录（用于推导 remote）。"
        remote:
          type: string
          description: "Repository URL, if you would rather name it directly."
          descriptions:
            zh: "仓库地址（若想直接指定）。"
        index:
          type: integer
          description: "The merge request number."
          descriptions:
            zh: "MR 编号。"
        reopen:
          type: boolean
          description: "Reopen the MR instead of closing it."
          descriptions:
            zh: "改为重新打开该 MR。"
      required: [index]
    required_config: [servers]
  - name: git-mr-merge
    description: >-
      Merge a merge request into its base branch. This is the ONLY tool that
      changes the base branch: `git-push` is refused, so landing code is an
      explicit, reviewable act. The agent head branch is deleted afterwards
      unless `delete-branch: false`.
    descriptions:
      zh: >-
        把 MR 合并进目标分支。这是**唯一**能改动目标分支的工具：`git-push` 已被拒绝，
        因此合入代码是一个显式、可评审的动作。默认合并后删除 agent 头分支，
        `delete-branch: false` 可保留。
    requires: [mr.merge]
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: "Which sandbox to run in (only needed when `remote` is omitted)."
          descriptions:
            zh: "在哪个沙箱中运行（仅在省略 `remote` 时需要）。"
        path:
          type: string
          description: "The git repository directory in the sandbox (used to derive the remote)."
          descriptions:
            zh: "沙箱内 git 仓库目录（用于推导 remote）。"
        remote:
          type: string
          description: "Repository URL, if you would rather name it directly."
          descriptions:
            zh: "仓库地址（若想直接指定）。"
        index:
          type: integer
          description: "The merge request number."
          descriptions:
            zh: "MR 编号。"
        style:
          type: string
          description: >-
            merge (default from the repo) | rebase | rebase-merge | squash |
            fast-forward-only.
          descriptions:
            zh: "merge（仓库默认）| rebase | rebase-merge | squash | fast-forward-only。"
        title:
          type: string
          description: "Merge commit title (optional)."
          descriptions:
            zh: "合并提交标题（可选）。"
        message:
          type: string
          description: "Merge commit message (optional)."
          descriptions:
            zh: "合并提交信息（可选）。"
        delete-branch:
          type: boolean
          description: "Delete the head branch after merging (default true)."
          descriptions:
            zh: "合并后删除头分支（默认 true）。"
      required: [index]
    required_config: [servers]
  - name: git-remote-show
    description: >-
      Print ONE file from a remote repository WITHOUT cloning it, straight from
      the forge's API. Ideal for reading a README, a config file or a Dockerfile
      before deciding whether a clone is worth it. Needs no sandbox.
    descriptions:
      zh: >-
        不克隆、直接通过 forge API 输出远端仓库中的单个文件。适合在决定是否克隆前
        先读 README、配置文件或 Dockerfile。无需沙箱。
    input_schema:
      type: object
      properties:
        remote:
          type: string
          description: "Repository URL, e.g. https://git.example.com/owner/repo.git"
          descriptions:
            zh: "仓库地址，如 https://git.example.com/owner/repo.git"
        path:
          type: string
          description: "File path inside the repository (e.g. README.md)."
          descriptions:
            zh: "仓库内文件路径（如 README.md）。"
        ref:
          type: string
          description: "Branch, tag or commit (default: the repository's default branch)."
          descriptions:
            zh: "分支、标签或提交（默认：仓库的默认分支）。"
      required: [remote, path]
    required_config: [servers]

  # ── Staging area ────────────────────────────────────────────────────────────
  #
  # Read and edit repository content WITHOUT a clone and WITHOUT a sandbox.
  #
  # The git-* tools above run git inside a sandbox, which is right for "build this,
  # run the tests". It is the wrong shape for "change one line and open a PR":
  # spawning a container to send three API calls turns a one-second edit into a
  # minute-long one, and hides the change until the container exists.
  #
  # These tools operate on content stored in a database, so the whole flow —
  # read, edit, diff, submit — happens without a checkout.
  - name: git-stage-import
    description: >-
      Import a remote branch into the extension's content store. This is the step that
      makes the staging tools usable: they read stored content, so a base revision has
      to exist first. Idempotent — importing the same branch twice adds nothing.
    descriptions:
      zh: >-
        把远端分支导入扩展的内容存储。这是让暂存工具可用的第一步：它们读取存储内容，
        因此必须先有一个基准版本。幂等：重复导入同一分支不会新增内容。
    input_schema:
      type: object
      properties:
        remote:
          type: string
          description: "Repository URL, e.g. https://git.example.com/owner/repo.git"
          descriptions:
            zh: "仓库地址，如 https://git.example.com/owner/repo.git"
        branch:
          type: string
          description: "Branch to import (default: the configured default branch)."
          descriptions:
            zh: "要导入的分支（默认：配置的默认分支）。"
      required: [remote]

  - name: git-tree
    description: >-
      List the files in a repository WITHOUT cloning it. Reads from the extension's
      content store, so no sandbox is needed. Optionally filter by path prefix.
    descriptions:
      zh: >-
        不克隆仓库直接列出文件。从扩展的内容存储读取，无需沙箱。可按路径前缀过滤。
    input_schema:
      type: object
      properties:
        repo:
          type: string
          description: "Repository name as configured (default: the extension's default repository)."
          descriptions:
            zh: "配置中的仓库名（默认：扩展的默认仓库）。"
        path:
          type: string
          description: "Only list paths with this prefix."
          descriptions:
            zh: "只列出带此前缀的路径。"
        ref:
          type: string
          description: "Revision to read from (default: the tip)."
          descriptions:
            zh: "读取的版本（默认：最新）。"

  - name: git-read
    description: >-
      Read one file from a repository WITHOUT cloning it. Returns the staged version
      when the path has uncommitted edits, so a caller always sees its own writes.
    descriptions:
      zh: >-
        不克隆仓库直接读取单个文件。若该路径有未提交的暂存修改，返回暂存版本，
        因此调用方总能看到自己刚写入的内容。
    input_schema:
      type: object
      properties:
        repo:
          type: string
          description: "Repository name as configured."
          descriptions:
            zh: "配置中的仓库名。"
        path:
          type: string
          description: "File path inside the repository."
          descriptions:
            zh: "仓库内文件路径。"
        ref:
          type: string
          description: "Revision to read from (default: the tip)."
          descriptions:
            zh: "读取的版本（默认：最新）。"
      required: [path]

  - name: git-write
    description: >-
      Stage a new or replaced file. Nothing is pushed yet: the change lives in the
      staging area until git-stage-submit. Staging the same path twice replaces the
      earlier content rather than stacking edits.
    descriptions:
      zh: >-
        暂存新建或覆盖的文件。此时不会推送：修改留在暂存区，直到
        git-stage-submit。同一路径重复暂存会替换先前内容，而不是叠加。
    input_schema:
      type: object
      properties:
        repo:
          type: string
          description: "Repository name as configured."
          descriptions:
            zh: "配置中的仓库名。"
        path:
          type: string
          description: "File path to write."
          descriptions:
            zh: "要写入的文件路径。"
        content:
          type: string
          description: "Full file content (not a patch)."
          descriptions:
            zh: "完整的文件内容（不是补丁）。"
        ref:
          type: string
          description: "Revision the change is based on (default: the tip)."
          descriptions:
            zh: "修改所基于的版本（默认：最新）。"
      required: [path, content]

  - name: git-remove
    description: >-
      Stage a file deletion. Like git-write, this only affects the staging area until
      git-stage-submit.
    descriptions:
      zh: "暂存删除文件。与 git-write 一样，在 git-stage-submit 之前只影响暂存区。"
    input_schema:
      type: object
      properties:
        repo:
          type: string
          description: "Repository name as configured."
          descriptions:
            zh: "配置中的仓库名。"
        path:
          type: string
          description: "File path to delete."
          descriptions:
            zh: "要删除的文件路径。"
        ref:
          type: string
          description: "Revision the change is based on (default: the tip)."
          descriptions:
            zh: "修改所基于的版本（默认：最新）。"
      required: [path]

  - name: git-stage-status
    description: >-
      Show what is staged: each changed path marked added/modified/deleted, with line
      counts. This is the "what am I about to submit" view.
    descriptions:
      zh: >-
        显示暂存内容：每个变更路径标记为新增/修改/删除，并给出行数变化。
        这是"我即将提交什么"的视图。
    input_schema:
      type: object
      properties:
        repo:
          type: string
          description: "Repository name as configured."
          descriptions:
            zh: "配置中的仓库名。"
        ref:
          type: string
          description: "Base revision to compare against (default: the tip)."
          descriptions:
            zh: "用于比较的基准版本（默认：最新）。"

  - name: git-stage-diff
    description: >-
      Show the staged change as a unified diff. Computed from stored content, so no
      git binary and no sandbox is involved. Binary files are reported as such rather
      than rendered.
    descriptions:
      zh: >-
        以统一 diff 形式显示暂存修改。基于存储的内容计算，不涉及 git 二进制或沙箱。
        二进制文件会被标注而不是渲染。
    input_schema:
      type: object
      properties:
        repo:
          type: string
          description: "Repository name as configured."
          descriptions:
            zh: "配置中的仓库名。"
        ref:
          type: string
          description: "Base revision to compare against (default: the tip)."
          descriptions:
            zh: "用于比较的基准版本（默认：最新）。"

  - name: git-stage-reset
    description: >-
      Discard staged changes. With a path, discards that one file's edit; without,
      discards everything. The repository itself is never modified.
    descriptions:
      zh: >-
        丢弃暂存修改。给出路径时只丢弃该文件的修改；不给则丢弃全部。
        仓库本身永远不受影响。
    input_schema:
      type: object
      properties:
        repo:
          type: string
          description: "Repository name as configured."
          descriptions:
            zh: "配置中的仓库名。"
        path:
          type: string
          description: "Only discard this path (omit to discard everything)."
          descriptions:
            zh: "只丢弃该路径（省略则丢弃全部）。"

  - name: git-stage-submit
    description: >-
      Push the staged changes to a new branch and open a pull request, all from stored
      content: no clone, no sandbox, no git binary. The branch name is generated per
      submission so an existing review is never rewritten. The pull request body is
      filled with a generated change summary.
    descriptions:
      zh: >-
        把暂存修改推送到新分支并创建 MR，全程基于存储内容：不克隆、不用沙箱、
        不依赖 git 二进制。分支名每次提交都重新生成，因此不会改写已有评审。
        MR 正文会自动附带变更摘要。
    input_schema:
      type: object
      properties:
        remote:
          type: string
          description: "Repository URL, e.g. https://git.example.com/owner/repo.git"
          descriptions:
            zh: "仓库地址，如 https://git.example.com/owner/repo.git"
        title:
          type: string
          description: "Pull request title."
          descriptions:
            zh: "MR 标题。"
        body:
          type: string
          description: "Pull request body (a change summary is appended)."
          descriptions:
            zh: "MR 正文（会自动附加变更摘要）。"
        base:
          type: string
          description: "Target branch (default: the configured default branch)."
          descriptions:
            zh: "目标分支（默认：配置的默认分支）。"
        branch:
          type: string
          description: "Head branch name (default: generated per submission)."
          descriptions:
            zh: "源分支名（默认：每次提交自动生成）。"
        repo:
          type: string
          description: "Repository name as configured."
          descriptions:
            zh: "配置中的仓库名。"
        ref:
          type: string
          description: "Base revision the change is based on (default: the tip)."
          descriptions:
            zh: "修改所基于的版本（默认：最新）。"
      required: [remote, title]

# ── permissions ─────────────────────────────────────────────────────────────
#
# What a caller must hold to perform a WRITE. Read tools are deliberately ungated: a
# session that may not merge should still be able to look at the pull request, and gating
# reads would make every grant also a grant of visibility.
#
# A permission is a (key, params) pair, not a bare name — "merge in this repository" and
# "merge in that one" are two authorisations, so a session may hold several grants of the
# same key. The `params` block below uses the SAME schema as config knobs, so a client
# renders a real form.
#
# `repo` accepts `owner/name` or a `*` wildcard (`agentdev/*`, `*`). Whether a grant covers
# a call is decided by this extension, which is the only side that knows a remote URL
# denotes a repository.
permissions:
  - key: mr.merge
    label: Merge pull requests
    descriptions:
      zh: 合并 MR
    risk: destructive
    params:
      - name: repo
        type: string
        required: true
        description: >-
          Repository as owner/name, or a wildcard such as agentdev/* or *.
        descriptions:
          zh: 仓库，owner/name 形式，或通配符如 agentdev/* 或 *。

  - key: mr.close
    label: Close pull requests without merging
    descriptions:
      zh: 关闭 MR（不合并）
    risk: write
    params:
      - name: repo
        type: string
        required: true
        description: >-
          Repository as owner/name, or a wildcard such as agentdev/* or *.
        descriptions:
          zh: 仓库，owner/name 形式，或通配符如 agentdev/* 或 *。

  - key: repo.create
    label: Create repositories
    descriptions:
      zh: 创建仓库
    risk: write
    params:
      - name: repo
        type: string
        required: true
        description: >-
          Repository as owner/name, or a wildcard such as agentdev/* or *.
        descriptions:
          zh: 仓库，owner/name 形式，或通配符如 agentdev/* 或 *。

  - key: repo.delete
    label: Delete repositories
    descriptions:
      zh: 删除仓库
    risk: destructive
    params:
      - name: repo
        type: string
        required: true
        description: >-
          Repository as owner/name, or a wildcard such as agentdev/* or *.
        descriptions:
          zh: 仓库，owner/name 形式，或通配符如 agentdev/* 或 *。

config:
  - name: sandboxes
    type: list
    item_type: object
    min_items: 1
    kind: secret
    scope: global
    description: >-
      The easyworker sandboxes git runs IN. Every git-* tool takes a `sandbox`
      argument selecting one by name (the first is the default). git itself runs
      inside the sandbox. This value is a SECRET: it is never returned to a
      client.
    descriptions:
      zh: >-
        运行 git 的 easyworker 沙箱列表。每个 git-* 工具通过 `sandbox` 参数按名选择
        （默认第一个）。git 本身在沙箱内运行。该值为机密：永不返回给客户端。
    fields:
      - name: name
        type: string
        required: true
        description: Sandbox name, used to select it from the git-* tools.
        descriptions:
          zh: 沙箱名称，git-* 工具用它来选择。
      - name: url
        type: string
        format: uri
        required: true
        description: Worker HTTP base URL (e.g. http://worker.ns.svc.cluster.local:80).
        descriptions:
          zh: worker 的 HTTP 基础地址（如 http://worker.ns.svc.cluster.local:80）。
      - name: token
        type: string
        kind: secret
        required: true
        description: Worker access token. Masked in the console; never returned.
        descriptions:
          zh: worker 访问令牌。控制台中以掩码显示，永不回传。
      - name: os
        type: enum
        enum_values: [linux, windows, macos, android]
        default: linux
        description: Sandbox OS, for tooling that differs per platform.
        descriptions:
          zh: 沙箱操作系统，供按平台区分的工具使用。
  - name: servers
    type: list
    item_type: object
    kind: secret
    scope: global
    description: >-
      The git hosts to authenticate against. A server is selected by the remote
      URL's host; `kind` picks the HTTPS basic-auth username (github ->
      x-access-token, gitlab -> oauth2, gitea -> the real account) AND which
      platform API the read-only remote tools use. SECRET: never returned to a
      client.
    descriptions:
      zh: >-
        需要认证的 git 主机列表。按 remote URL 的主机选择；`kind` 既决定 HTTPS
        basic-auth 用户名（github → x-access-token，gitlab → oauth2，gitea → 真实账号），
        也决定只读远端工具使用哪个平台 API。机密：永不返回给客户端。
    fields:
      - name: host
        type: string
        format: host
        required: true
        description: Hostname only, no scheme and no path (e.g. github.com).
        descriptions:
          zh: 仅主机名，不含协议和路径（如 github.com）。
      - name: kind
        type: enum
        enum_values: [github, gitlab, gitea, generic]
        default: generic
        description: >-
          The forge. It selects the basic-auth username and the platform API used
          by the read-only remote tools.
        descriptions:
          zh: 平台类型。决定 basic-auth 用户名，以及只读远端工具所用平台 API。
      - name: token
        type: string
        kind: secret
        description: >-
          Personal access token. Empty = anonymous (public repositories only).
        descriptions:
          zh: 个人访问令牌。留空表示匿名（仅可读公开仓库）。
      - name: user
        type: string
        description: >-
          Overrides the basic-auth username. Gitea (and generic hosts) need the
          real account name.
        descriptions:
          zh: 覆盖 basic-auth 用户名。Gitea（及通用主机）需要真实账号名。
      - name: api_url
        type: string
        format: uri
        description: >-
          Optional API base override, e.g. https://git.example.com/api/v1 for a
          self-hosted forge served from a different origin than the git host.
        descriptions:
          zh: >-
            可选的 API 基础地址覆盖，如自建 forge 的 https://git.example.com/api/v1
            （API 与 git 主机不同源时使用）。
  - name: require-auth
    type: boolean
    scope: global
    default: false
    description: "When true, a remote host with no configured server is rejected instead of anonymous."
    descriptions:
      zh: "为 true 时，主机未配置服务器的 remote 会被拒绝，而不会匿名访问。"
