id: github
version: 1.0
lifecycle: [deleted]

# github-ext: work on GitHub repositories and their CI with NO local sandbox.
#
# The whole extension exists to answer one question: can a tool change a repository without a
# checkout? The answer is a staging area plus exactly one way out — a pull request.
#
# Reading works anonymously on a public repository. Writing needs a token.

config:
  - name: token
    type: secret
    description: >-
      GitHub personal access token. Not needed to READ a public repository; needed for
      everything that changes one.
    descriptions:
      zh: >-
        GitHub 个人访问令牌。读取公开仓库不需要；修改仓库时必须。
    required: false

  - name: api-url
    type: string
    description: >-
      API root for GitHub Enterprise, e.g. https://github.example.com/api/v3. Leave empty
      for github.com.
    descriptions:
      zh: GitHub Enterprise 的 API 地址，例如 https://github.example.com/api/v3。github.com 留空。
    required: false

  - name: watch-repos
    type: string
    description: >-
      Comma-separated owner/name repositories whose RELEASES are published on the `github`
      channel. Opt-in per repository: polling everything a token can see would exhaust the rate
      limit and mostly watch repositories nobody here cares about.
    descriptions:
      zh: >-
        逗号分隔的 owner/name 仓库清单，其 RELEASE 会发布到 `github` 频道。
        按仓库逐个开启：轮询 token 能看到的所有仓库会耗尽配额，而且大多与本处无关。
    required: false

  - name: watch-interval
    type: string
    description: How often to poll for releases, e.g. "60s". Empty uses one minute.
    descriptions:
      zh: 轮询 release 的间隔，例如 "60s"。留空表示一分钟。
    required: false

  - name: watch-prereleases
    type: string
    description: >-
      "true" to announce prereleases too. Off by default: an -rc is not what a downstream build
      should react to, and announcing it would wake every consumer.
    descriptions:
      zh: >-
        设为 "true" 时也宣告预发布。默认关闭：-rc 不该触发下游构建，宣告它只会唤醒所有消费者。
    required: false

permissions:
  - key: run.rerun
    label: Rerun CI
    descriptions:
      zh: 重跑 CI
    risk: write
    params:
      - name: repo
        type: string
        descriptions:
          zh: 仓库。
    descriptions_long:
      zh: 允许重跑某次运行（默认只重跑失败的 job）。会消耗 CI 时间和额度。

  - key: run.cancel
    label: Cancel CI
    descriptions:
      zh: 取消 CI
    risk: destructive
    params:
      - name: repo
        type: string
        descriptions:
          zh: 仓库。
    descriptions_long:
      zh: 允许取消运行中的工作流。正在执行的步骤会中断，尚未完成的工作不会产出结果。

  - key: run.dispatch
    label: Trigger CI
    descriptions:
      zh: 触发 CI
    risk: write
    params:
      - name: repo
        type: string
        descriptions:
          zh: 仓库。
    descriptions_long:
      zh: 允许手动触发 workflow_dispatch。这意味着可以启动部署或发布流程。

  - key: pr.create
    label: Open pull requests
    descriptions:
      zh: 创建拉取请求
    risk: write
    params:
      - name: repo
        type: string
        required: true
        description: Repository as owner/name, or * for all.
        descriptions:
          zh: 仓库（owner/name），或用 * 表示全部。

  - key: pr.merge
    # destructive, not write: merging changes the base branch, which is what everything else
    # is built on. Opening a PR is reversible with one click; merging is not.
    label: Merge pull requests
    descriptions:
      zh: 合并拉取请求
    risk: destructive
    params:
      - name: repo
        type: string
        required: true
        description: Repository as owner/name, or * for all.
        descriptions:
          zh: 仓库（owner/name），或用 * 表示全部。

  - key: pr.close
    label: Close pull requests without merging
    descriptions:
      zh: 关闭拉取请求（不合并）
    risk: write
    params:
      - name: repo
        type: string
        required: true
        description: Repository as owner/name, or * for all.
        descriptions:
          zh: 仓库（owner/name），或用 * 表示全部。

  - key: repo.create
    label: Create repositories
    descriptions:
      zh: 创建仓库
    risk: write
    params:
      - name: repo
        type: string
        required: true
        description: Repository as owner/name, or * for all.
        descriptions:
          zh: 仓库（owner/name），或用 * 表示全部。

  - key: repo.delete
    label: Delete repositories
    descriptions:
      zh: 删除仓库
    risk: destructive
    params:
      - name: repo
        type: string
        required: true
        description: Repository as owner/name, or * for all.
        descriptions:
          zh: 仓库（owner/name），或用 * 表示全部。

  - key: tag.create
    # write, and the event that STARTS a downstream chain: a tag is what a consumer
    # subscribes to, so creating one tells every follower that a version exists.
    label: Create tags (announces a version)
    descriptions:
      zh: 创建标签（宣告一个版本）
    risk: write
    params:
      - name: repo
        type: string
        required: true
        description: Repository as owner/name, or * for all.
        descriptions:
          zh: 仓库（owner/name），或用 * 表示全部。

  - key: tag.delete
    # destructive: the version disappears for everyone, including anyone already following it.
    label: Delete tags
    descriptions:
      zh: 删除标签
    risk: destructive
    params:
      - name: repo
        type: string
        required: true
        description: Repository as owner/name, or * for all.
        descriptions:
          zh: 仓库（owner/name），或用 * 表示全部。

tools:
  # ── local git (a workspace on disk; no GitHub call, no token) ────────────────
  - name: git-ws-clone
    description: >-
      Clone a repository into a new WORKSPACE and return its id. This is the only way to get a
      workspace, and every other git-ws-* tool needs one. The id is random and belongs to this
      session; it is not derived from the repository and cannot be guessed.
    descriptions:
      zh: >-
        把仓库克隆到一个新的「工作区」并返回其 id。这是获取工作区的唯一途径，其他所有 git-ws-* 工具都需要它。
        id 是随机的、归属本 session，不由仓库名推导，无法被猜到。
    input_schema:
      type: object
      properties:
        repo:
          type: string
          description: Repository as owner/name.
          descriptions:
            zh: 仓库（owner/name）。
        ref:
          type: string
          description: Branch, tag or commit. Empty = the default branch.
          descriptions:
            zh: 分支、标签或提交。留空表示默认分支。
        depth:
          type: integer
          description: >-
            Clone depth. 0 (default) keeps the full history, so questions about older commits
            have real answers; 1 is faster but forgets the past.
          descriptions:
            zh: 克隆深度。0（默认）保留完整历史，这样对旧提交的疑问才有真实答案；1 更快但会丢弃历史。
      required: [repo]

  - name: git-ws-workspace
    description: List this session's workspaces, or close one with `close`.
    descriptions:
      zh: 列出本 session 的工作区；传 `close` 则关闭指定工作区。
    input_schema:
      type: object
      properties:
        close:
          type: string
          description: Workspace id to delete.
          descriptions:
            zh: 要删除的工作区 id。

  - name: git-ws-status
    description: What changed in the workspace, against the checked-out commit.
    descriptions:
      zh: 工作区相对当前检出的提交有哪些改动。
    input_schema:
      type: object
      properties:
        workspace:
          type: string
          descriptions:
            zh: 工作区 id。
      required: [workspace]

  - name: git-ws-patch
    description: >-
      Edit files in the workspace with a patch. THE ONLY EDITING TOOL. Format: "*** Begin
      Patch" / "*** Add File: path" (+lines) / "*** Update File: path" (@@ anchor, then ' '
      context, '-' removed, '+' added) / "*** Delete File: path" / "*** End Patch". Applied
      whole or not at all: a failing hunk leaves the tree untouched.
    descriptions:
      zh: >-
        用补丁修改工作区文件。这是唯一的编辑工具。格式：Begin Patch / Add File（每行前缀 +）/
        Update File（@@ 锚点，随后空格上下文、减号删除、加号新增）/ Delete File / End Patch。
        整份生效或整份失败：任一 hunk 失败则工作区不变。
    input_schema:
      type: object
      properties:
        workspace:
          type: string
          descriptions:
            zh: 工作区 id。
        patch:
          type: string
          descriptions:
            zh: 补丁文本。
      required: [workspace, patch]

  - name: git-ws-read
    description: Read a file from the workspace, with line numbers.
    descriptions:
      zh: 读取工作区中的文件，带行号。
    input_schema:
      type: object
      properties:
        workspace:
          type: string
          descriptions:
            zh: 工作区 id。
        path:
          type: string
          description: Path relative to the workspace root.
          descriptions:
            zh: 相对工作区根目录的路径。
      required: [workspace, path]

  - name: git-ws-list
    description: List every file in the workspace.
    descriptions:
      zh: 列出工作区中的全部文件。
    input_schema:
      type: object
      properties:
        workspace:
          type: string
          descriptions:
            zh: 工作区 id。
      required: [workspace]

  - name: git-ws-log
    description: >-
      The workspace's commit history — real authors and real commit dates, because this is a
      real git checkout.
    descriptions:
      zh: 工作区的提交历史——真实的作者与提交时间，因为这就是一个真实的 git 检出。
    input_schema:
      type: object
      properties:
        workspace:
          type: string
          descriptions:
            zh: 工作区 id。
        limit:
          type: integer
          descriptions:
            zh: 最多返回条数（默认 20）。
      required: [workspace]

  - name: git-ws-diff
    description: >-
      The workspace's changes as a unified diff. Pass `path` to narrow it to one file. Capped at
      2000 lines, and says so when the cap applies.
    descriptions:
      zh: 工作区的改动，unified diff 格式。传 `path` 可只看单个文件。上限 2000 行，触发时会说明。
    input_schema:
      type: object
      properties:
        workspace:
          type: string
          descriptions:
            zh: 工作区 id。
        path:
          type: string
          description: Limit the diff to this file.
          descriptions:
            zh: 只看这个文件。
        staged:
          type: boolean
          description: Compare against the index instead of the working tree.
          descriptions:
            zh: 与索引比较，而不是与工作区比较。
      required: [workspace]

  - name: git-ws-blame
    description: >-
      Who last changed each line of a file, and when. Bounded to a line range (default 200
      lines) because an unbounded blame of a large file buries the answer.
    descriptions:
      zh: >-
        文件中每一行最后是谁、什么时候改的。限定行范围（默认 200 行），因为无限制地 blame 大文件会把答案淹没。
    input_schema:
      type: object
      properties:
        workspace:
          type: string
          descriptions:
            zh: 工作区 id。
        path:
          type: string
          descriptions:
            zh: 文件路径。
        from:
          type: integer
          description: First line (1-based).
          descriptions:
            zh: 起始行（从 1 开始）。
        to:
          type: integer
          description: Last line.
          descriptions:
            zh: 结束行。
      required: [workspace, path]

  - name: git-ws-commit
    description: >-
      Commit the workspace's changes LOCALLY. Does not push, and may be called repeatedly — a
      change is often several commits. Publish with gh-pr-create.
    descriptions:
      zh: >-
        在本地提交工作区的改动。不推送，可多次调用——一个改动常常需要多个提交。发布用 gh-pr-create。
    input_schema:
      type: object
      properties:
        workspace:
          type: string
          descriptions:
            zh: 工作区 id。
        message:
          type: string
          descriptions:
            zh: 提交信息。
      required: [workspace, message]

  - name: git-ws-pull
    description: >-
      Fast-forward the workspace to its remote. FAST-FORWARD ONLY: if local commits and the
      remote have diverged, it reports that and changes nothing, because only the caller can
      decide which to keep.
    descriptions:
      zh: >-
        将工作区快进到远端。只允许 fast-forward：若本地提交与远端已分叉，会报告并保持原样，
        因为只有调用者能决定保留哪一边。
    input_schema:
      type: object
      properties:
        workspace:
          type: string
          descriptions:
            zh: 工作区 id。
        branch:
          type: string
          description: Branch to fast-forward from. Empty = the current branch.
          descriptions:
            zh: 从哪里快进。留空表示当前分支。
      required: [workspace]

  - name: git-ws-reset
    description: >-
      Discard working-tree changes, restoring files to the checked-out commit. With `hard` it
      also deletes untracked files — and a hard reset of the WHOLE workspace additionally needs
      `confirm`, because that is the one operation here that destroys work never committed.
    descriptions:
      zh: >-
        丢弃工作区改动，把文件恢复到检出的提交。传 `hard` 还会删除未跟踪文件——而对整个工作区做 hard reset
        还需要 `confirm`，因为这是唯一会销毁未提交工作的操作。
    input_schema:
      type: object
      properties:
        workspace:
          type: string
          descriptions:
            zh: 工作区 id。
        path:
          type: string
          description: Limit the reset to this file.
          descriptions:
            zh: 只重置这个文件。
        hard:
          type: boolean
          description: Also delete untracked files.
          descriptions:
            zh: 同时删除未跟踪文件。
        confirm:
          type: boolean
          description: Required for a hard reset of the whole workspace.
          descriptions:
            zh: 对整个工作区做 hard reset 时必需。
      required: [workspace]

  # ── github platform ─────────────────────────────────────────────────────────
  - name: gh-info
    description: Repository metadata. Works without a token on a public repository.
    descriptions:
      zh: 仓库元信息。公开仓库无需令牌。
    input_schema:
      type: object
      properties:
        repo:
          type: string
          descriptions:
            zh: 仓库（owner/name）。
      required: [repo]

  - name: gh-whoami
    description: The token's identity, its scopes, and the remaining request budget.
    descriptions:
      zh: 令牌身份、权限范围与剩余请求配额。
    input_schema:
      type: object
      properties: {}

  - name: gh-orgs
    description: Organizations the caller belongs to.
    descriptions:
      zh: 当前身份所属的组织。
    input_schema:
      type: object
      properties: {}

  - name: gh-repos
    description: Repositories the caller can see, optionally for one organization.
    descriptions:
      zh: 当前身份可见的仓库，可限定某个组织。
    input_schema:
      type: object
      properties:
        org:
          type: string
          descriptions:
            zh: 组织名。
        type:
          type: string
          description: all | public | private | forks | sources | member
          descriptions:
            zh: all | public | private | forks | sources | member
        visibility:
          type: string
          descriptions:
            zh: all | public | private

  - name: gh-releases
    description: Releases for a repository; with `tag`, that one release.
    descriptions:
      zh: 仓库的 release 列表；传 `tag` 则返回该 release 的详情。
    input_schema:
      type: object
      properties:
        repo:
          type: string
          descriptions:
            zh: 仓库。
        tag:
          type: string
          descriptions:
            zh: 标签名。
        limit:
          type: integer
          descriptions:
            zh: 最多返回条数。
      required: [repo]

  - name: gh-packages
    description: An organization's packages, or one package's versions.
    descriptions:
      zh: 组织的软件包，或某个包的版本列表。
    input_schema:
      type: object
      properties:
        org:
          type: string
          descriptions:
            zh: 组织名。
        kind:
          type: string
          descriptions:
            zh: container | npm | maven | rubygems | nuget（默认 container）
        package:
          type: string
          descriptions:
            zh: 包名。
      required: [org]

  - name: gh-tag-create
    description: >-
      Create an ANNOTATED tag. `message` is required: an annotated tag is a published event
      with a description, and a release is built on one.
    descriptions:
      zh: 创建附注标签。`message` 必填：附注标签是带说明的发布事件，release 也建立在它之上。
    input_schema:
      type: object
      properties:
        repo:
          type: string
          descriptions:
            zh: 仓库。
        tag:
          type: string
          descriptions:
            zh: 标签名，例如 v1.2.3。
        ref:
          type: string
          description: Branch, tag or commit to tag. Empty = the default branch.
          descriptions:
            zh: 要打标签的分支、标签或提交。留空表示默认分支。
        message:
          type: string
          description: Required. The tag's description.
          descriptions:
            zh: 必填。标签的说明。
      required: [repo, tag, message]
    requires: [tag.create]

  - name: gh-tag-list
    description: Tags with the commit each points at.
    descriptions:
      zh: 标签列表，含各自指向的提交。
    input_schema:
      type: object
      properties:
        repo:
          type: string
          descriptions:
            zh: 仓库。
      required: [repo]

  - name: gh-tag-show
    description: >-
      One tag's annotation: the message, who tagged it and when. A separate call because
      GitHub's tag LIST does not include the message.
    descriptions:
      zh: >-
        单个标签的附注：说明、打标签的人与时间。之所以单独一个工具，是因为 GitHub 的标签列表不含附注。
    input_schema:
      type: object
      properties:
        repo:
          type: string
          descriptions:
            zh: 仓库。
        tag:
          type: string
          descriptions:
            zh: 标签名。
      required: [repo, tag]

  - name: gh-tag-delete
    description: >-
      Delete a tag AND its release. The two go together unconditionally: a release left behind
      would still be announced at a tag nobody can check out. IRREVERSIBLE.
    descriptions:
      zh: 删除标签及其 release。两者无条件一起删除：留下的 release 仍会宣告一个无法检出的版本。不可撤销。
    input_schema:
      type: object
      properties:
        repo:
          type: string
          descriptions:
            zh: 仓库。
        tag:
          type: string
          descriptions:
            zh: 标签名。
      required: [repo, tag]
    requires: [tag.delete]

  - name: gh-repo-create
    description: Create a repository, under `org` or the authenticated user.
    descriptions:
      zh: 创建仓库（`org` 下或当前用户名下）。
    input_schema:
      type: object
      properties:
        name:
          type: string
          descriptions:
            zh: 仓库名。
        org:
          type: string
          descriptions:
            zh: 组织名（可选）。
        description:
          type: string
          descriptions:
            zh: 描述。
        private:
          type: boolean
          descriptions:
            zh: 是否私有。
        auto_init:
          type: boolean
          descriptions:
            zh: 是否创建初始提交。
      required: [name]
    requires: [repo.create]

  - name: gh-repo-rename
    description: Rename a repository.
    descriptions:
      zh: 重命名仓库。
    input_schema:
      type: object
      properties:
        repo:
          type: string
          descriptions:
            zh: 当前仓库。
        name:
          type: string
          descriptions:
            zh: 新名称。
      required: [repo, name]

  - name: gh-repo-delete
    description: >-
      Delete a repository. IRREVERSIBLE. `confirm` must equal the repository slug, so a wrong
      slug cannot delete the wrong repository.
    descriptions:
      zh: 删除仓库。不可撤销。`confirm` 必须等于仓库全名，避免笔误删错仓库。
    input_schema:
      type: object
      properties:
        repo:
          type: string
          descriptions:
            zh: 要删除的仓库。
        confirm:
          type: string
          descriptions:
            zh: 必须与 `repo` 完全相同。
      required: [repo, confirm]
    requires: [repo.delete]

  - name: gh-pr-create
    description: >-
      Publish a WORKSPACE as a pull request: commit it, push a fresh branch pr/<id>, open the
      PR. THE ONLY WAY A CHANGE REACHES GITHUB — there is no commit tool and no push tool.
    descriptions:
      zh: >-
        把「工作区」发布为拉取请求：提交、推送到新分支 pr/<id>、开 PR。这是改动进入 GitHub 的唯一途径——
        没有提交工具，也没有推送工具。
    input_schema:
      type: object
      properties:
        workspace:
          type: string
          descriptions:
            zh: 工作区 id。
        repo:
          type: string
          description: Must match the workspace's repository.
          descriptions:
            zh: 必须与工作区的仓库一致。
        title:
          type: string
          descriptions:
            zh: PR 标题（同时作为提交信息）。
        body:
          type: string
          descriptions:
            zh: PR 描述。
        base:
          type: string
          description: Branch to merge into. Empty = the repository's default branch.
          descriptions:
            zh: 合入的目标分支。留空表示仓库默认分支。
      required: [workspace, repo, title]
    requires: [pr.create]

  - name: gh-pr-list
    description: Pull requests, newest first.
    descriptions:
      zh: 拉取请求列表，最新的在前。
    input_schema:
      type: object
      properties:
        repo:
          type: string
          descriptions:
            zh: 仓库。
        state:
          type: string
          descriptions:
            zh: open | closed | all（默认 open）
      required: [repo]

  - name: gh-pr-show
    description: One pull request, including whether it can be merged.
    descriptions:
      zh: 单个拉取请求，含是否可合并。
    input_schema:
      type: object
      properties:
        repo:
          type: string
          descriptions:
            zh: 仓库。
        number:
          type: integer
          descriptions:
            zh: PR 编号。
      required: [repo, number]

  - name: gh-pr-files
    description: >-
      The files a pull request changes, with per-file counts. A file whose patch GitHub does not
      send (binary, or too large) is marked as such rather than shown as an empty change.
    descriptions:
      zh: >-
        PR 改动的文件列表与每个文件的增删行数。GitHub 未提供补丁的文件（二进制或过大）会被明确标注，
        而不是显示为空改动。
    input_schema:
      type: object
      properties:
        repo:
          type: string
          descriptions:
            zh: 仓库。
        number:
          type: integer
          descriptions:
            zh: PR 编号。
      required: [repo, number]

  - name: gh-pr-diff
    description: The whole pull request as one unified diff. Capped at 2000 lines, and says so.
    descriptions:
      zh: 整个 PR 的 unified diff。上限 2000 行，触发时会说明。
    input_schema:
      type: object
      properties:
        repo:
          type: string
          descriptions:
            zh: 仓库。
        number:
          type: integer
          descriptions:
            zh: PR 编号。
      required: [repo, number]

  - name: gh-pr-checks
    description: CI status for a pull request, from both check runs and commit statuses.
    descriptions:
      zh: 拉取请求的 CI 状态，同时考虑 check runs 与 commit statuses。
    input_schema:
      type: object
      properties:
        repo:
          type: string
          descriptions:
            zh: 仓库。
        number:
          type: integer
          descriptions:
            zh: PR 编号。
      required: [repo, number]

  - name: gh-pr-merge
    description: Merge a pull request. A refused merge is reported as an error, not a success.
    descriptions:
      zh: 合并拉取请求。被拒绝的合并会作为错误报告，而不是假装成功。
    input_schema:
      type: object
      properties:
        repo:
          type: string
          descriptions:
            zh: 仓库。
        number:
          type: integer
          descriptions:
            zh: PR 编号。
        method:
          type: string
          descriptions:
            zh: merge | squash | rebase（默认 merge）
        title:
          type: string
          descriptions:
            zh: 合并提交标题。
        message:
          type: string
          descriptions:
            zh: 合并提交信息。
      required: [repo, number]
    requires: [pr.merge]

  - name: gh-pr-close
    description: Close a pull request without merging.
    descriptions:
      zh: 关闭拉取请求（不合并）。
    input_schema:
      type: object
      properties:
        repo:
          type: string
          descriptions:
            zh: 仓库。
        number:
          type: integer
          descriptions:
            zh: PR 编号。
      required: [repo, number]
    requires: [pr.close]

  - name: gh-workflow-list
    description: The repository's Actions workflows.
    descriptions:
      zh: 仓库的 Actions 工作流列表。
    input_schema:
      type: object
      properties:
        repo:
          type: string
          descriptions:
            zh: 仓库。
      required: [repo]

  - name: gh-run-list
    description: Workflow runs, newest first, filterable by branch and trigger.
    descriptions:
      zh: 工作流运行列表，最新的在前，可按分支与触发方式过滤。
    input_schema:
      type: object
      properties:
        repo:
          type: string
          descriptions:
            zh: 仓库。
        branch:
          type: string
          descriptions:
            zh: 只显示该分支的运行。
        event:
          type: string
          descriptions:
            zh: push | pull_request | workflow_dispatch | ...
        limit:
          type: integer
          descriptions:
            zh: 最多返回条数（默认 30）。
      required: [repo]

  - name: gh-run-jobs
    description: >-
      Jobs and per-step status of a run — the LIVE view. GitHub publishes a job's LOG only after
      the job finishes, so use gh-run-log for output.
    descriptions:
      zh: >-
        某次运行的 job 与逐步状态——实时视图。GitHub 只在 job 结束后才提供日志，所以读输出请用 gh-run-log。
    input_schema:
      type: object
      properties:
        repo:
          type: string
          descriptions:
            zh: 仓库。
        run:
          type: integer
          description: Run id from gh-run-list.
          descriptions:
            zh: 来自 gh-run-list 的运行 id。
      required: [repo, run]

  - name: gh-run-log
    description: >-
      A run's logs, one section per job. Available only once the jobs have finished — GitHub has
      no API for a running job's output.
    descriptions:
      zh: >-
        某次运行的日志，按 job 分段。仅在 job 结束后可用——GitHub 没有提供运行中 job 输出的 API。
    input_schema:
      type: object
      properties:
        repo:
          type: string
          descriptions:
            zh: 仓库。
        run:
          type: integer
          description: Run id from gh-run-list.
          descriptions:
            zh: 来自 gh-run-list 的运行 id。
        lines:
          type: integer
          description: Max lines per job (default 500).
          descriptions:
            zh: 每个 job 最多返回的行数（默认 500）。
      required: [repo, run]

  - name: gh-job-log
    description: >-
      One job's log. Use this rather than gh-run-log when a run reports "unit failed" — it
      returns that job's text directly instead of a zip of every job. The line cap keeps the LAST
      lines, because a failure is at the end of a log. NOT available while the job runs: GitHub
      has no API for a running job's output, and this fails with an explanation saying so.
    descriptions:
      zh: >-
        单个 job 的日志。当运行报告「unit 失败」时用它，而不是 gh-run-log——它直接返回该 job 的文本，
        而不是所有 job 的 zip。行数上限保留的是**最后**几行，因为失败在日志末尾。
        运行中不可用：GitHub 没有提供运行中 job 输出的 API，本工具会明确说明这一点。
    input_schema:
      type: object
      properties:
        repo:
          type: string
          descriptions:
            zh: 仓库。
        job:
          type: integer
          description: Job id from gh-run-jobs.
          descriptions:
            zh: 来自 gh-run-jobs 的 job id。
        lines:
          type: integer
          description: Max lines, taken from the END of the log (default 500).
          descriptions:
            zh: 最多返回的行数，取日志**末尾**（默认 500）。
      required: [repo, job]

  - name: gh-artifacts
    description: >-
      The artifacts a run uploaded: id, name, size, and whether each has EXPIRED (an expired one
      cannot be downloaded, so this says so before a caller tries).
    descriptions:
      zh: >-
        某次运行上传的产物：id、名称、大小，以及是否已**过期**（过期的无法下载，先说明以免调用者白试）。
    input_schema:
      type: object
      properties:
        repo:
          type: string
          descriptions:
            zh: 仓库。
        run:
          type: integer
          description: Run id from gh-run-list.
          descriptions:
            zh: 来自 gh-run-list 的运行 id。
      required: [repo, run]

  - name: gh-artifact-download
    description: >-
      Download one artifact and store it in the tenant's OBJECT STORAGE, returning the object
      name. The archive is not returned inline — an artifact is a zip of arbitrary size, and
      base64 in a tool result would be unreadable and would flood the conversation.
    descriptions:
      zh: >-
        下载单个产物并存入租户的**对象存储**，返回对象名。压缩包不会直接内联返回——产物大小不定，
        在工具结果里放 base64 既读不了又会淹没对话。
    input_schema:
      type: object
      properties:
        repo:
          type: string
          descriptions:
            zh: 仓库。
        artifact:
          type: integer
          description: Artifact id from gh-artifacts.
          descriptions:
            zh: 来自 gh-artifacts 的产物 id。
        name:
          type: string
          description: Used in the stored object name.
          descriptions:
            zh: 用于生成存储对象名。
        max_bytes:
          type: integer
          description: Refuse anything larger (default 64 MiB).
          descriptions:
            zh: 超过此大小则拒绝（默认 64 MiB）。
      required: [repo, artifact]

  - name: gh-run-rerun
    description: >-
      Rerun a run. Defaults to `failed_only: true` — a rerun is almost always "the flaky one
      failed", and rerunning everything throws away the jobs that already passed. A rerun starts
      a new ATTEMPT on the same run id.
    descriptions:
      zh: >-
        重跑某次运行。默认 `failed_only: true`——重跑几乎总是因为「那个 flaky 的失败了」，
        全部重跑会丢掉已经通过的 job。重跑会在同一个 run id 上开始新的 **attempt**。
    input_schema:
      type: object
      properties:
        repo:
          type: string
          descriptions:
            zh: 仓库。
        run:
          type: integer
          description: Run id from gh-run-list.
          descriptions:
            zh: 来自 gh-run-list 的运行 id。
        failed_only:
          type: boolean
          description: Rerun only the failed jobs (default true).
          descriptions:
            zh: 只重跑失败的 job（默认 true）。
      required: [repo, run]
    requires: [run.rerun]

  - name: gh-run-cancel
    description: >-
      Cancel a run. Cancellation is a REQUEST, not an instant stop: GitHub lets the step in
      progress finish, so poll gh-run-jobs until the job reports completed.
    descriptions:
      zh: >-
        取消某次运行。取消是**请求**而非立即停止：GitHub 会让当前步骤走完，因此要轮询 gh-run-jobs
        直到 job 显示 completed。
    input_schema:
      type: object
      properties:
        repo:
          type: string
          descriptions:
            zh: 仓库。
        run:
          type: integer
          description: Run id from gh-run-list.
          descriptions:
            zh: 来自 gh-run-list 的运行 id。
      required: [repo, run]
    requires: [run.cancel]

  - name: gh-run-dispatch
    description: >-
      Trigger a workflow_dispatch. `workflow` is the file name (ci.yml) or the numeric id.
      `ref` defaults to the repository's default branch. Returns the run id it created, so the
      caller can follow it rather than guess.
    descriptions:
      zh: >-
        触发 workflow_dispatch。`workflow` 为文件名（ci.yml）或数字 id。`ref` 默认取仓库默认分支。
        返回它创建出的 run id，调用者可直接跟进而不必猜。
    input_schema:
      type: object
      properties:
        repo:
          type: string
          descriptions:
            zh: 仓库。
        workflow:
          type: string
          description: Workflow file name or id.
          descriptions:
            zh: 工作流文件名或 id。
        ref:
          type: string
          description: Branch or tag. Empty = default branch.
          descriptions:
            zh: 分支或标签。留空表示默认分支。
        inputs:
          type: object
          description: The workflow's declared inputs.
          descriptions:
            zh: 工作流声明的输入参数。
      required: [repo, workflow]
    requires: [run.dispatch]

# Events this extension publishes, so a session can follow a repository and be woken when
# something ships.
#
# The channel is `github`, not `gitea`: the two extensions report different forges, and a
# subscriber following GitHub releases should not also receive tags from a self-hosted Gitea.
#
# WHY `release.` and not `tag.`: a TAG is a pointer a build might consume; a RELEASE is an
# announcement a human made. "Notice the new version" almost always means the release, and a tag
# pushed without one is not yet news.
channels:
  - name: github
    description: Repository events from GitHub.
    descriptions:
      zh: 来自 GitHub 的仓库事件。
    topics:
      - pattern: "release.<owner>/<repo>.<tag>"
        description: >-
          A release was published on a repository. Subscribe with "release.<owner>/<repo>.>" to
          follow one repository, or "release.<owner>/>" for every repository under an owner.
          Prereleases and drafts are not announced unless watch-prereleases is on.
        descriptions:
          zh: >-
            仓库发布了 release。用 "release.<owner>/<repo>.>" 订阅某个仓库，
            或用 "release.<owner>/>" 订阅某个 owner 下的所有仓库。
            预发布和草稿默认不宣告，除非开启 watch-prereleases。
        payload:
          type: object
          properties:
            repo: {type: string}
            tag: {type: string}
            name: {type: string}
            url: {type: string}
            ref: {type: string}
            prerelease: {type: boolean}
            published_at: {type: string}
