id: gitea
version: 2.0
lifecycle: [deleted]

# gitea-ext: git operations against a repository inside a remote easyworker
# sandbox. Every tool runs `git` IN the sandbox (via the worker Execute RPC),
# so it needs no system git of its own. Each tool takes a `sandbox` (which
# worker) and a `path` (the repository directory in that sandbox); the path
# must be a git repository or the call is rejected.
tools:
  - name: git-clone
    description: >-
      Clone a repository into `path` in the sandbox and return its current branch + HEAD.
    descriptions:
      zh: >-
        将仓库克隆到沙箱内的 `path` 并返回当前分支与 HEAD。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: "Which sandbox to run in (see list-sandboxes). Omit when only one is configured."
          descriptions:
            zh: "在哪个沙箱中运行（见 list-sandboxes）。仅配置一个时可省略。"
        path:
          type: string
          description: "The git repository directory in the sandbox (relative to the workspace root)."
          descriptions:
            zh: "沙箱内 git 仓库目录（相对于工作区根）。"
        remote:
          type: string
          description: "The git URL."
          descriptions:
            zh: "git 地址。"
        branch:
          type: string
          description: "Branch to check out (default the remote default)."
          descriptions:
            zh: "要检出的分支（默认远端默认）。"
        depth:
          type: integer
          description: "Shallow depth (default 1; 0 = full)."
          descriptions:
            zh: "浅克隆深度（默认 1；0 表示完整）。"
      required: [sandbox, path, remote]
    required_config: [sandboxes, servers]
  - name: git-status
    description: >-
      Show the working-tree status of the repo at `path`.
    descriptions:
      zh: >-
        显示 `path` 处仓库的工作区状态。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: "Which sandbox to run in (see list-sandboxes). Omit when only one is configured."
          descriptions:
            zh: "在哪个沙箱中运行（见 list-sandboxes）。仅配置一个时可省略。"
        path:
          type: string
          description: "The git repository directory in the sandbox (relative to the workspace root)."
          descriptions:
            zh: "沙箱内 git 仓库目录（相对于工作区根）。"
      required: [sandbox, path]
    required_config: [sandboxes, servers]
  - name: git-log
    description: >-
      List recent commits of the repo at `path`.
    descriptions:
      zh: >-
        列出 `path` 处仓库的最近提交。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: "Which sandbox to run in (see list-sandboxes). Omit when only one is configured."
          descriptions:
            zh: "在哪个沙箱中运行（见 list-sandboxes）。仅配置一个时可省略。"
        path:
          type: string
          description: "The git repository directory in the sandbox (relative to the workspace root)."
          descriptions:
            zh: "沙箱内 git 仓库目录（相对于工作区根）。"
        limit:
          type: integer
          description: "Max commits (default 20)."
          descriptions:
            zh: "最大提交数（默认 20）。"
      required: [sandbox, path]
    required_config: [sandboxes, servers]
  - name: git-diff
    description: >-
      Show the diff of the repo at `path`.
    descriptions:
      zh: >-
        显示 `path` 处仓库的差异。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: "Which sandbox to run in (see list-sandboxes). Omit when only one is configured."
          descriptions:
            zh: "在哪个沙箱中运行（见 list-sandboxes）。仅配置一个时可省略。"
        path:
          type: string
          description: "The git repository directory in the sandbox (relative to the workspace root)."
          descriptions:
            zh: "沙箱内 git 仓库目录（相对于工作区根）。"
        staged:
          type: boolean
          description: "Diff the staged changes."
          descriptions:
            zh: "比较已暂存的变更。"
        from:
          type: string
          description: "From revision."
          descriptions:
            zh: "起始版本。"
        to:
          type: string
          description: "To revision."
          descriptions:
            zh: "目标版本。"
      required: [sandbox, path]
    required_config: [sandboxes, servers]
  - name: git-branch
    description: >-
      List branches of the repo at `path`.
    descriptions:
      zh: >-
        列出 `path` 处仓库的分支。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: "Which sandbox to run in (see list-sandboxes). Omit when only one is configured."
          descriptions:
            zh: "在哪个沙箱中运行（见 list-sandboxes）。仅配置一个时可省略。"
        path:
          type: string
          description: "The git repository directory in the sandbox (relative to the workspace root)."
          descriptions:
            zh: "沙箱内 git 仓库目录（相对于工作区根）。"
        remoteOnly:
          type: boolean
          description: "List remote-tracking branches."
          descriptions:
            zh: "列出远端跟踪分支。"
      required: [sandbox, path]
    required_config: [sandboxes, servers]
  - name: git-checkout
    description: >-
      Switch to a branch in the repo at `path`.
    descriptions:
      zh: >-
        切换到 `path` 处仓库的某个分支。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: "Which sandbox to run in (see list-sandboxes). Omit when only one is configured."
          descriptions:
            zh: "在哪个沙箱中运行（见 list-sandboxes）。仅配置一个时可省略。"
        path:
          type: string
          description: "The git repository directory in the sandbox (relative to the workspace root)."
          descriptions:
            zh: "沙箱内 git 仓库目录（相对于工作区根）。"
        branch:
          type: string
          description: "Branch name."
          descriptions:
            zh: "分支名。"
        create:
          type: boolean
          description: "Create it if absent."
          descriptions:
            zh: "不存在时创建。"
      required: [sandbox, path, branch]
    required_config: [sandboxes, servers]
  - name: git-add
    description: >-
      Stage paths in the repo at `path` (omit `paths` to stage all).
    descriptions:
      zh: >-
        暂存 `path` 处仓库的路径（省略 `paths` 则暂存全部）。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: "Which sandbox to run in (see list-sandboxes). Omit when only one is configured."
          descriptions:
            zh: "在哪个沙箱中运行（见 list-sandboxes）。仅配置一个时可省略。"
        path:
          type: string
          description: "The git repository directory in the sandbox (relative to the workspace root)."
          descriptions:
            zh: "沙箱内 git 仓库目录（相对于工作区根）。"
        paths:
          type: array
          description: "Paths to stage."
          descriptions:
            zh: "要暂存的路径。"
      required: [sandbox, path]
    required_config: [sandboxes, servers]
  - name: git-commit
    description: >-
      Commit in the repo at `path`.
    descriptions:
      zh: >-
        在 `path` 处仓库提交。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: "Which sandbox to run in (see list-sandboxes). Omit when only one is configured."
          descriptions:
            zh: "在哪个沙箱中运行（见 list-sandboxes）。仅配置一个时可省略。"
        path:
          type: string
          description: "The git repository directory in the sandbox (relative to the workspace root)."
          descriptions:
            zh: "沙箱内 git 仓库目录（相对于工作区根）。"
        message:
          type: string
          description: "Commit message."
          descriptions:
            zh: "提交信息。"
        all:
          type: boolean
          description: "Stage tracked changes first."
          descriptions:
            zh: "先暂存已跟踪文件的变更。"
        author:
          type: string
          description: "Author (Name <email>)."
          descriptions:
            zh: "作者（Name <email>）。"
      required: [sandbox, path, message]
    required_config: [sandboxes, servers]
  - name: git-pull
    description: >-
      Fetch + fast-forward the repo at `path` from origin.
    descriptions:
      zh: >-
        从 origin 拉取并快进 `path` 处仓库。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: "Which sandbox to run in (see list-sandboxes). Omit when only one is configured."
          descriptions:
            zh: "在哪个沙箱中运行（见 list-sandboxes）。仅配置一个时可省略。"
        path:
          type: string
          description: "The git repository directory in the sandbox (relative to the workspace root)."
          descriptions:
            zh: "沙箱内 git 仓库目录（相对于工作区根）。"
      required: [sandbox, path]
    required_config: [sandboxes, servers]
  - name: git-push
    description: >-
      DISABLED. Direct push is refused on purpose: changes reach the remote only
      through review. Calling this returns an error explaining that you must use
      `git-submit-mr` instead (it pushes to an `agent/*` head branch and opens a
      merge request).
    descriptions:
      zh: >-
        已禁用。直接 push 会被拒绝：改动只能通过评审进入远端。调用它会返回错误，
        提示改用 `git-submit-mr`（推到 `agent/*` 临时分支并开 MR）。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: "Which sandbox to run in (see list-sandboxes). Omit when only one is configured."
          descriptions:
            zh: "在哪个沙箱中运行（见 list-sandboxes）。仅配置一个时可省略。"
        path:
          type: string
          description: "The git repository directory in the sandbox (relative to the workspace root)."
          descriptions:
            zh: "沙箱内 git 仓库目录（相对于工作区根）。"
        branch:
          type: string
          description: "Branch to push (default current)."
          descriptions:
            zh: "要推送的分支（默认当前）。"
        force:
          type: boolean
          description: "Force-with-lease push."
          descriptions:
            zh: "强制（force-with-lease）推送。"
      required: [sandbox, path]
    required_config: [sandboxes, servers]
  - name: git-show
    description: >-
      Print a file's content at a revision in the repo at `path`.
    descriptions:
      zh: >-
        输出 `path` 处仓库某版本下某文件的内容。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: "Which sandbox to run in (see list-sandboxes). Omit when only one is configured."
          descriptions:
            zh: "在哪个沙箱中运行（见 list-sandboxes）。仅配置一个时可省略。"
        path:
          type: string
          description: "The git repository directory in the sandbox (relative to the workspace root)."
          descriptions:
            zh: "沙箱内 git 仓库目录（相对于工作区根）。"
        file:
          type: string
          description: "File path in the repo."
          descriptions:
            zh: "仓库内文件路径。"
        rev:
          type: string
          description: "Revision (default HEAD)."
          descriptions:
            zh: "版本（默认 HEAD）。"
      required: [sandbox, path, file]
    required_config: [sandboxes, servers]
  - name: git-remote-ls
    description: >-
      List a REMOTE repository's branches and tags WITHOUT cloning it, straight
      from the forge's API (one request). Use this to answer "which branches
      exist" or "what is the latest commit" before deciding whether to clone.
      Needs no sandbox.
    descriptions:
      zh: >-
        不克隆、直接通过 forge API（一次请求）列出远端仓库的分支与标签。适合回答
        「有哪些分支」「最新提交是哪个」，再决定要不要克隆。无需沙箱。
    input_schema:
      type: object
      properties:
        remote:
          type: string
          description: "Repository URL, e.g. https://git.example.com/owner/repo.git"
          descriptions:
            zh: "仓库地址，如 https://git.example.com/owner/repo.git"
      required: [remote]
    required_config: [servers]
  - name: git-submit-mr
    description: >-
      Submit the current branch for REVIEW: pushes it to a NEW immutable
      `agent/<session>-<timestamp>` head branch and opens a merge request into
      `base`. This is the ONLY way changes reach the remote — `git-push` is
      refused. Commit locally first; an empty difference is rejected.
    descriptions:
      zh: >-
        提交当前分支以供评审：推到一个**新的不可变** `agent/<会话>-<时间戳>` 头分支，
        并向 `base` 开 MR。这是改动进入远端的**唯一**途径——`git-push` 已被拒绝。
        请先在本地 commit；没有差异会被拒绝。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: "Which sandbox to run in (see list-sandboxes). Omit when only one is configured."
          descriptions:
            zh: "在哪个沙箱中运行（见 list-sandboxes）。仅配置一个时可省略。"
        path:
          type: string
          description: "The git repository directory in the sandbox."
          descriptions:
            zh: "沙箱内 git 仓库目录。"
        base:
          type: string
          description: "Target branch (default: the extension's default-branch setting, usually main)."
          descriptions:
            zh: "目标分支（默认：扩展的 default-branch 配置，通常是 main）。"
        title:
          type: string
          description: "Merge request title."
          descriptions:
            zh: "MR 标题。"
        body:
          type: string
          description: "Merge request description (optional)."
          descriptions:
            zh: "MR 描述（可选）。"
      required: [sandbox, path, title]
    required_config: [sandboxes, servers]
  - name: git-mr-list
    description: >-
      List merge requests of a repository (default: the one at `path`, state
      open). Use it to see whether your submission is still open and what a
      reviewer sees.
    descriptions:
      zh: >-
        列出仓库的 MR（默认：`path` 处那个仓库、状态为 open）。用于确认自己提交的 MR
        是否仍未合并。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: "Which sandbox to run in (only needed when `remote` is omitted)."
          descriptions:
            zh: "在哪个沙箱中运行（仅在省略 `remote` 时需要）。"
        path:
          type: string
          description: "The git repository directory in the sandbox (used to derive the remote)."
          descriptions:
            zh: "沙箱内 git 仓库目录（用于推导 remote）。"
        remote:
          type: string
          description: "Repository URL, if you would rather name it directly."
          descriptions:
            zh: "仓库地址（若想直接指定）。"
        state:
          type: string
          description: "\"open\" (default) | \"closed\" | \"all\"."
          descriptions:
            zh: "\"open\"（默认）| \"closed\" | \"all\"。"
      required: []
    required_config: [servers]
  - name: git-remote-show
    description: >-
      Print ONE file from a remote repository WITHOUT cloning it, straight from
      the forge's API. Ideal for reading a README, a config file or a Dockerfile
      before deciding whether a clone is worth it. Needs no sandbox.
    descriptions:
      zh: >-
        不克隆、直接通过 forge API 输出远端仓库中的单个文件。适合在决定是否克隆前
        先读 README、配置文件或 Dockerfile。无需沙箱。
    input_schema:
      type: object
      properties:
        remote:
          type: string
          description: "Repository URL, e.g. https://git.example.com/owner/repo.git"
          descriptions:
            zh: "仓库地址，如 https://git.example.com/owner/repo.git"
        path:
          type: string
          description: "File path inside the repository (e.g. README.md)."
          descriptions:
            zh: "仓库内文件路径（如 README.md）。"
        ref:
          type: string
          description: "Branch, tag or commit (default: the repository's default branch)."
          descriptions:
            zh: "分支、标签或提交（默认：仓库的默认分支）。"
      required: [remote, path]
    required_config: [servers]

config:
  - name: sandboxes
    type: list
    item_type: object
    min_items: 1
    kind: secret
    scope: global
    description: >-
      The easyworker sandboxes git runs IN. Every git-* tool takes a `sandbox`
      argument selecting one by name (the first is the default). git itself runs
      inside the sandbox. This value is a SECRET: it is never returned to a
      client.
    descriptions:
      zh: >-
        运行 git 的 easyworker 沙箱列表。每个 git-* 工具通过 `sandbox` 参数按名选择
        （默认第一个）。git 本身在沙箱内运行。该值为机密：永不返回给客户端。
    fields:
      - name: name
        type: string
        required: true
        description: Sandbox name, used to select it from the git-* tools.
        descriptions:
          zh: 沙箱名称，git-* 工具用它来选择。
      - name: url
        type: string
        format: uri
        required: true
        description: Worker HTTP base URL (e.g. http://worker.ns.svc.cluster.local:80).
        descriptions:
          zh: worker 的 HTTP 基础地址（如 http://worker.ns.svc.cluster.local:80）。
      - name: token
        type: string
        kind: secret
        required: true
        description: Worker access token. Masked in the console; never returned.
        descriptions:
          zh: worker 访问令牌。控制台中以掩码显示，永不回传。
      - name: os
        type: enum
        enum_values: [linux, windows, macos, android]
        default: linux
        description: Sandbox OS, for tooling that differs per platform.
        descriptions:
          zh: 沙箱操作系统，供按平台区分的工具使用。
  - name: servers
    type: list
    item_type: object
    kind: secret
    scope: global
    description: >-
      The git hosts to authenticate against. A server is selected by the remote
      URL's host; `kind` picks the HTTPS basic-auth username (github ->
      x-access-token, gitlab -> oauth2, gitea -> the real account) AND which
      platform API the read-only remote tools use. SECRET: never returned to a
      client.
    descriptions:
      zh: >-
        需要认证的 git 主机列表。按 remote URL 的主机选择；`kind` 既决定 HTTPS
        basic-auth 用户名（github → x-access-token，gitlab → oauth2，gitea → 真实账号），
        也决定只读远端工具使用哪个平台 API。机密：永不返回给客户端。
    fields:
      - name: host
        type: string
        format: host
        required: true
        description: Hostname only, no scheme and no path (e.g. github.com).
        descriptions:
          zh: 仅主机名，不含协议和路径（如 github.com）。
      - name: kind
        type: enum
        enum_values: [github, gitlab, gitea, generic]
        default: generic
        description: >-
          The forge. It selects the basic-auth username and the platform API used
          by the read-only remote tools.
        descriptions:
          zh: 平台类型。决定 basic-auth 用户名，以及只读远端工具所用平台 API。
      - name: token
        type: string
        kind: secret
        description: >-
          Personal access token. Empty = anonymous (public repositories only).
        descriptions:
          zh: 个人访问令牌。留空表示匿名（仅可读公开仓库）。
      - name: user
        type: string
        description: >-
          Overrides the basic-auth username. Gitea (and generic hosts) need the
          real account name.
        descriptions:
          zh: 覆盖 basic-auth 用户名。Gitea（及通用主机）需要真实账号名。
      - name: api_url
        type: string
        format: uri
        description: >-
          Optional API base override, e.g. https://git.example.com/api/v1 for a
          self-hosted forge served from a different origin than the git host.
        descriptions:
          zh: >-
            可选的 API 基础地址覆盖，如自建 forge 的 https://git.example.com/api/v1
            （API 与 git 主机不同源时使用）。
  - name: require-auth
    type: boolean
    scope: global
    default: false
    description: "When true, a remote host with no configured server is rejected instead of anonymous."
    descriptions:
      zh: "为 true 时，主机未配置服务器的 remote 会被拒绝，而不会匿名访问。"
