id: git
version: 1.0
lifecycle: [deleted]

# git-ext: the mirror and GitHub, because "change the code and land it" is one job.
#
# GITHUB IS THE AUTHORITY. What is merged, reviewed and released lives there.
#
# THE MIRROR IS THE WORKSPACE. It is a writable copy of the repository, changed through the forge's
# own API: a branch is a ref, a file is an object, and a commit is one call. Nothing is cloned and
# nothing is checked out, so there is no directory to keep in sync and none to clean up.
#
# THE PATH OUT IS ONE WAY AND IT IS REVIEWED:
#
#   git-sync-upstream    make main current (fast-forward only)
#   git-branch-create    a working branch
#   git-file-patch       the change — one patch, one commit
#   git-push-branch      send that branch, and nothing else
#   gh-pr-create         open the request
#
# Reading works anonymously on a public repository. Writing needs a token.

config:
  - name: servers
    type: list
    item_type: object
    kind: secret
    scope: global
    description: >-
      The git hosts to authenticate against. A server is selected by the remote
      URL's host; `kind` picks the HTTPS basic-auth username (github ->
      x-access-token, gitlab -> oauth2, gitea -> the real account) AND which
      platform API the read-only remote tools use. SECRET: never returned to a
      client.
    descriptions:
      zh: >-
        需要认证的 git 主机列表。按 remote URL 的主机选择；`kind` 既决定 HTTPS
        basic-auth 用户名（github → x-access-token，gitlab → oauth2，gitea → 真实账号），
        也决定只读远端工具使用哪个平台 API。机密：永不返回给客户端。
    fields:
      - name: host
        type: string
        format: host
        required: true
        description: Hostname only, no scheme and no path (e.g. github.com).
        descriptions:
          zh: 仅主机名，不含协议和路径（如 github.com）。
      - name: kind
        type: enum
        enum_values: [github, gitlab, gitea, generic]
        default: generic
        description: >-
          The forge. It selects the basic-auth username and the platform API used
          by the read-only remote tools.
        descriptions:
          zh: 平台类型。决定 basic-auth 用户名，以及只读远端工具所用平台 API。
      - name: token
        type: string
        kind: secret
        description: >-
          Personal access token. Empty = anonymous (public repositories only).
        descriptions:
          zh: 个人访问令牌。留空表示匿名（仅可读公开仓库）。
      - name: user
        type: string
        description: >-
          Overrides the basic-auth username. Gitea (and generic hosts) need the
          real account name.
        descriptions:
          zh: 覆盖 basic-auth 用户名。Gitea（及通用主机）需要真实账号名。
      - name: api_url
        type: string
        format: uri
        description: >-
          Optional API base override, e.g. https://git.example.com/api/v1 for a
          self-hosted forge served from a different origin than the git host.
        descriptions:
          zh: >-
            可选的 API 基础地址覆盖，如自建 forge 的 https://git.example.com/api/v1
            （API 与 git 主机不同源时使用）。
  - name: token
    type: secret
    description: >-
      GitHub personal access token. Not needed to READ a public repository; needed for
      everything that changes one.
    descriptions:
      zh: >-
        GitHub 个人访问令牌。读取公开仓库不需要；修改仓库时必须。
    required: false

  - name: api-url
    type: string
    description: >-
      API root for GitHub Enterprise, e.g. https://github.example.com/api/v3. Leave empty
      for github.com.
    descriptions:
      zh: GitHub Enterprise 的 API 地址，例如 https://github.example.com/api/v3。github.com 留空。
    required: false

  - name: watch-repos
    type: string
    description: >-
      Comma-separated owner/name repositories whose RELEASES are published on the `github`
      channel. Opt-in per repository: polling everything a token can see would exhaust the rate
      limit and mostly watch repositories nobody here cares about.
    descriptions:
      zh: >-
        逗号分隔的 owner/name 仓库清单，其 RELEASE 会发布到 `github` 频道。
        按仓库逐个开启：轮询 token 能看到的所有仓库会耗尽配额，而且大多与本处无关。
    required: false

  - name: watch-interval
    type: string
    description: How often to poll for releases, e.g. "60s". Empty uses one minute.
    descriptions:
      zh: 轮询 release 的间隔，例如 "60s"。留空表示一分钟。
    required: false

  - name: watch-prereleases
    type: string
    description: >-
      "true" to announce prereleases too. Off by default: an -rc is not what a downstream build
      should react to, and announcing it would wake every consumer.
    descriptions:
      zh: >-
        设为 "true" 时也宣告预发布。默认关闭：-rc 不该触发下游构建，宣告它只会唤醒所有消费者。
    required: false

permissions:
  - key: repo.maintainer
    label: Maintainer
    descriptions:
      zh: 负责人
    risk: destructive
    params:
      - name: repo
        type: string
        descriptions:
          zh: 仓库（owner/name）。
    descriptions_long:
      zh: >-
        允许一切**会改变东西**的操作：创建与合并拉取请求、关闭 issue、
        触发/重跑/取消 CI、创建与删除标签、删除或重命名仓库。
        读、提 issue、评论**不需要**此权限——那些不改变任何东西。

  - key: org.admin
    label: Organization admin
    descriptions:
      zh: 组织管理员
    risk: write
    params:
      - name: org
        type: string
        descriptions:
          zh: 组织名，用 * 表示全部。
    descriptions_long:
      zh: >-
        可以创建仓库。这是**组织级**权限而非仓库级：仓库尚不存在，没有可作用的对象。

tools:
  # ── 本地 git（工作区目录，不联网）─────────────────────────────────────────
  - name: git-branch-create
    description: >-
      Make a working branch, from a local branch or from one that exists only on
      the upstream. A name that ALREADY EXISTS is refused by default: silently
      handing back the old branch means patching, pushing and updating a pull
      request the caller believed was new.
      This is where a change starts — there is no clone and no checkout anywhere.
    descriptions:
      zh: >-
        创建开发分支，可以从本地分支，也可以从**只存在于上游**的分支。同名分支
        **默认拒绝**：静默返回旧分支意味着调用方以为在改新分支，实际却在旧分支上
        打补丁、推送，并更新了一个他以为全新的 PR。
        改动从这里开始——全程没有克隆，也没有工作区。
    input_schema:
      type: object
      properties:
        remote:
          type: string
          description: "Repository URL, e.g. https://git.example.com/owner/repo.git"
          descriptions:
            zh: "仓库地址，如 https://git.example.com/owner/repo.git"
        branch:
          type: string
          description: "Branch to create. Must NOT be a protected branch — those only move by merges on the upstream."
          descriptions:
            zh: "要创建的分支名。**不能是受保护分支**——受保护分支只能通过上游的合并前进。"
        from:
          type: string
          description: >-
            Where to start from (default: main). Either a branch in this mirror
            ("main"), or one on the upstream even if the mirror has never seen it
            ("upstream:feat/old") — the latter also needs `upstream`.
          descriptions:
            zh: >-
              起点（默认：main）。可以是本地镜像里的分支（"main"），也可以是**只存在于
              上游**的分支（"upstream:feat/old"，需同时给 upstream）。
        upstream:
          type: string
          description: "Upstream git URL, needed only when `from` is `upstream:<branch>`."
          descriptions:
            zh: "上游地址，仅当 from 为 upstream:<branch> 时需要。"
        on_exists:
          type: string
          description: >-
            What a name collision means: "fail" (default) refuses and names the
            commit occupying the name; "reuse" continues on that branch; "reset"
            deletes and recreates it, discarding what was there.
          descriptions:
            zh: >-
              同名时的处理："fail"（默认）拒绝并报出占用该名字的提交；"reuse" 续用该
              分支；"reset" 删除后重建，**会丢弃原有内容**。
      required: [remote, branch]
    required_config: [servers]
  - name: git-file-list
    description: >-
      List one directory of one branch. An empty dir means the repository root.
    descriptions:
      zh: "列出某个分支的某个目录。dir 为空表示仓库根目录。"
    input_schema:
      type: object
      properties:
        remote:
          type: string
          description: "Repository URL."
          descriptions:
            zh: "仓库地址。"
        branch:
          type: string
          description: "Branch to list."
          descriptions:
            zh: "列出哪个分支。"
        dir:
          type: string
          description: "Directory path (default: the root)."
          descriptions:
            zh: "目录路径（默认：根目录）。"
      required: [remote, branch]
    required_config: [servers]
  - name: git-file-patch
    description: >-
      Edit files with a patch. THE ONLY EDITING TOOL — there is no write, delete
      or move. Applied whole or not at all, and the whole patch becomes ONE
      commit, so "this change landed" is a single fact in the history.
    descriptions:
      zh: >-
        用补丁修改文件。**唯一的编辑工具**——没有 write/delete/move。整份生效或整份
        失败，且整份补丁成为**一个提交**，因此「这次改动生效了」在历史里是一个事实。
    input_schema:
      type: object
      properties:
        remote:
          type: string
          description: "Repository URL."
          descriptions:
            zh: "仓库地址。"
        branch:
          type: string
          description: "Branch to commit on. Must NOT be protected."
          descriptions:
            zh: "提交到哪个分支。**不能是受保护分支**。"
        message:
          type: string
          description: "Commit message. Required — a commit nobody can read in a log has to be opened to be understood."
          descriptions:
            zh: "提交信息。必填——日志里读不懂的提交只能被点开才知道是什么。"
        patch:
          type: string
          description: "The patch text (*** Begin Patch ... *** End Patch)."
          descriptions:
            zh: "补丁文本（*** Begin Patch ... *** End Patch）。"
      required: [remote, branch, message, patch]
    required_config: [servers]
  - name: git-file-read
    description: >-
      Read one file from one branch, with line numbers. Read before patching: the
      hunk header needs the current content.
    descriptions:
      zh: >-
        读取某个分支上的单个文件，带行号。打补丁前先读：hunk 头需要当前内容。
    input_schema:
      type: object
      properties:
        remote:
          type: string
          description: "Repository URL."
          descriptions:
            zh: "仓库地址。"
        branch:
          type: string
          description: "Branch to read from."
          descriptions:
            zh: "从哪个分支读取。"
        path:
          type: string
          description: "File path inside the repository."
          descriptions:
            zh: "仓库内的文件路径。"
      required: [remote, branch, path]
    required_config: [servers]
  - name: git-push-branch
    description: >-
      Send ONE branch to the upstream, under a name of your choosing. Nothing else
      leaves the mirror — unlike a push mirror, which sends every ref the moment it
      is committed, including experiments and misnamed branches.
      Refused when the destination branch has commits this one does not: overwriting
      it would lose work that exists nowhere else.
    descriptions:
      zh: >-
        把**一个**分支推到上游，名字可自选。镜像里的其他内容一概不外流——不像 push
        mirror 那样一提交就推走所有 ref，包括试验品和命名错误的分支。
        目标分支若有本地没有的提交则拒绝：覆盖会丢掉别处不存在的成果。
    input_schema:
      type: object
      properties:
        remote:
          type: string
          description: "Local repository URL (the mirror the branch comes from)."
          descriptions:
            zh: "本地仓库地址（分支来源的镜像）。"
        branch:
          type: string
          description: "Branch in the mirror to send."
          descriptions:
            zh: "镜像中要推送的分支。"
        upstream:
          type: string
          description: "Destination git URL, e.g. https://github.com/owner/repo.git"
          descriptions:
            zh: "目标地址，如 https://github.com/owner/repo.git"
        to:
          type: string
          description: "Name at the destination (default: the same branch name). Keep it fixed so a re-push updates the same pull request."
          descriptions:
            zh: "目标分支名（默认：同名）。保持固定可让重复推送更新同一个 PR。"
      required: [remote, branch, upstream]
    required_config: [servers]
  - name: git-sync-upstream
    description: >-
      Fast-forward a branch to its same-named branch on the upstream. FOR
      PROTECTED BRANCHES: call it before cutting a working branch, so the new
      branch starts from the current upstream rather than a stale mirror.
      Refuses when the local branch has commits the upstream does not — that
      state means somebody wrote to a protected branch, and overwriting would
      lose their work.
    descriptions:
      zh: >-
        把分支快进到上游的同名分支。**用于受保护分支**：在切开发分支之前调用，
        让新分支从当前的上游起步，而不是过期的镜像。若本地分支有上游没有的提交则拒绝
        ——那意味着有人直接写了受保护分支，覆盖会丢掉他的工作。
    input_schema:
      type: object
      properties:
        remote:
          type: string
          description: "Local repository URL (the mirror to bring up to date)."
          descriptions:
            zh: "本地仓库地址（要更新到最新的镜像）。"
        branch:
          type: string
          description: "Branch to fast-forward, e.g. main."
          descriptions:
            zh: "要快进的分支，如 main。"
        upstream:
          type: string
          description: "Upstream git URL to follow, e.g. https://github.com/owner/repo.git"
          descriptions:
            zh: "要跟随的上游地址，如 https://github.com/owner/repo.git"
      required: [remote, branch, upstream]
    required_config: [servers]
  - name: gh-issue-create
    description: >-
      Open an ISSUE. (A pull request cannot be created here: it starts from a workspace, via
      gh-pr-create.)
    descriptions:
      zh: "创建 **issue**。（此处不能创建拉取请求：拉取请求从工作区出发，用 gh-pr-create。）"
    input_schema:
      type: object
      properties:
        repo: {type: string, descriptions: {zh: 仓库。}}
        title: {type: string, descriptions: {zh: 标题。}}
        body: {type: string, descriptions: {zh: 正文（Markdown）。}}
        labels: {type: array, items: {type: string}, descriptions: {zh: 标签。}}
      required: [repo, title]

  - name: gh-issue-list
    description: >-
      Issues AND pull requests, one number space. `kind` filters to just one: all (default),
      issue, or pr.
    descriptions:
      zh: >-
        issue **和**拉取请求，共用一个编号空间。`kind` 可只取一种：all（默认）、issue、pr。
    input_schema:
      type: object
      properties:
        repo: {type: string, descriptions: {zh: 仓库。}}
        state: {type: string, descriptions: {zh: open | closed | all（默认 open）。}}
        label: {type: string, descriptions: {zh: 只显示带该标签的。}}
        kind: {type: string, descriptions: {zh: all | issue | pr（默认 all）。}}
        limit: {type: integer, descriptions: {zh: 最多条数（默认 30）。}}
      required: [repo]

  - name: gh-issue-show
    description: >-
      One issue OR pull request, identified by issue_id. Reports which it is, plus branch and
      mergeability when it is a pull request — so a caller need not know in advance.
    descriptions:
      zh: >-
        按 issue_id 查看 issue **或**拉取请求。会说明它到底是哪种；若是拉取请求还会给出分支与
        可合并性——调用者无需事先知道。
    input_schema:
      type: object
      properties:
        repo: {type: string, descriptions: {zh: 仓库。}}
        issue_id: {type: integer, descriptions: {zh: issue 或 PR 的编号。}}
      required: [repo, issue_id]

  - name: gh-issue-comment
    description: >-
      Comment on an issue or pull request. With `path` and `line` it attaches to that line of the
      diff — pull requests only; on an issue that is refused rather than downgraded.
    descriptions:
      zh: >-
        在 issue 或拉取请求上评论。带 `path` 与 `line` 时附在该行 diff 上——仅拉取请求可用；
        在 issue 上会被**拒绝**，而不是悄悄降级为普通评论。
    input_schema:
      type: object
      properties:
        repo: {type: string, descriptions: {zh: 仓库。}}
        issue_id: {type: integer, descriptions: {zh: issue 或 PR 的编号。}}
        body: {type: string, descriptions: {zh: 评论内容（Markdown）。}}
        path: {type: string, descriptions: {zh: 行内评论指向的文件。}}
        line: {type: integer, descriptions: {zh: 该文件中的行号。}}
        side: {type: string, descriptions: {zh: RIGHT（改动后，默认）或 LEFT（原始）。}}
      required: [repo, issue_id, body]

  - name: gh-issue-comments
    description: >-
      Everything said on an issue or pull request: the conversation AND the line comments,
      labelled separately.
    descriptions:
      zh: "issue 或拉取请求上的全部发言：对话评论**与**行内评论，分别标注。"
    input_schema:
      type: object
      properties:
        repo: {type: string, descriptions: {zh: 仓库。}}
        issue_id: {type: integer, descriptions: {zh: issue 或 PR 的编号。}}
      required: [repo, issue_id]

  - name: gh-issue-close
    description: >-
      Close an issue or pull request. Reports which, and for a pull request says that it was closed
      WITHOUT merging and the branch still exists. A developer may close only its own; a
      maintainer may close anyone's.
    descriptions:
      zh: >-
        关闭 issue 或拉取请求。会说明关的是哪种；若是拉取请求，还会说明是**未合并关闭**、分支仍在。
        开发者只能关自己创建的；负责人可以关任何人的。
    input_schema:
      type: object
      properties:
        repo: {type: string, descriptions: {zh: 仓库。}}
        issue_id: {type: integer, descriptions: {zh: issue 或 PR 的编号。}}
      required: [repo, issue_id]

  # ── 拉取请求独有（issue 没有这些动作）─────────────────────────────────────
    requires: [repo.maintainer]

  - name: gh-pr-create
    description: >-
      Publish a WORKSPACE as a pull request: commit, push a fresh branch pr/<id>, open the PR.
      Returns the issue_id of the pull request it created.
    descriptions:
      zh: >-
        把工作区发布为拉取请求：提交、推送新分支 pr/<id>、开 PR。
        返回所创建拉取请求的 **issue_id**。
    input_schema:
      type: object
      properties:
        workspace: {type: string, descriptions: {zh: 工作区 id。}}
        repo: {type: string, descriptions: {zh: 必须与工作区的仓库一致。}}
        title: {type: string, descriptions: {zh: PR 标题（同时作为提交信息）。}}
        body: {type: string, descriptions: {zh: PR 描述。}}
        base: {type: string, descriptions: {zh: 目标分支；留空为默认分支。}}
      required: [workspace, repo, title]
    requires: [repo.maintainer]

  - name: gh-pr-files
    description: The files a pull request changes, with per-file counts.
    descriptions:
      zh: 拉取请求改动的文件列表与每个文件的增删行数。
    input_schema:
      type: object
      properties:
        repo: {type: string, descriptions: {zh: 仓库。}}
        issue_id: {type: integer, descriptions: {zh: 拉取请求的 issue_id。}}
      required: [repo, issue_id]

  - name: gh-pr-diff
    description: The whole pull request as one unified diff. Capped at 2000 lines.
    descriptions:
      zh: 整个拉取请求的 unified diff。上限 2000 行。
    input_schema:
      type: object
      properties:
        repo: {type: string, descriptions: {zh: 仓库。}}
        issue_id: {type: integer, descriptions: {zh: 拉取请求的 issue_id。}}
      required: [repo, issue_id]

  - name: gh-pr-checks
    description: CI status for a pull request.
    descriptions:
      zh: 拉取请求的 CI 状态。
    input_schema:
      type: object
      properties:
        repo: {type: string, descriptions: {zh: 仓库。}}
        issue_id: {type: integer, descriptions: {zh: 拉取请求的 issue_id。}}
      required: [repo, issue_id]

  - name: gh-pr-merge
    description: >-
      Merge a pull request. THE ONLY ACTION AN ISSUE CANNOT DO. A refused merge is an error, not
      a success.
    descriptions:
      zh: "合并拉取请求。**issue 唯一做不到的动作**。被拒绝的合并会作为错误报告。"
    input_schema:
      type: object
      properties:
        repo: {type: string, descriptions: {zh: 仓库。}}
        issue_id: {type: integer, descriptions: {zh: 拉取请求的 issue_id。}}
        method: {type: string, descriptions: {zh: merge | squash | rebase（默认 merge）。}}
        title: {type: string, descriptions: {zh: 合并提交标题。}}
        message: {type: string, descriptions: {zh: 合并提交信息。}}
      required: [repo, issue_id]
    requires: [repo.maintainer]

  # ── 仓库、标签、账户 ────────────────────────────────────────────────────
  - name: gh-info
    description: Repository metadata. No token needed on a public repository.
    descriptions:
      zh: 仓库元信息。公开仓库无需令牌。
    input_schema:
      type: object
      properties:
        repo: {type: string, descriptions: {zh: 仓库。}}
      required: [repo]

  - name: gh-whoami
    description: The token's identity, scopes and remaining budget.
    descriptions:
      zh: 令牌身份、权限范围与剩余配额。
    input_schema: {type: object, properties: {}}

  - name: gh-orgs
    description: Organizations the caller belongs to.
    descriptions:
      zh: 所属组织。
    input_schema: {type: object, properties: {}}

  - name: gh-repos
    description: Repositories the caller can see.
    descriptions:
      zh: 可见仓库。
    input_schema:
      type: object
      properties:
        org: {type: string, descriptions: {zh: 组织名。}}
        type: {type: string, descriptions: {zh: all | public | private | forks | sources | member}}
        visibility: {type: string, descriptions: {zh: all | public | private}}

  - name: gh-releases
    description: Releases for a repository; with `tag`, that one release.
    descriptions:
      zh: 仓库的 release 列表；传 `tag` 返回该条详情。
    input_schema:
      type: object
      properties:
        repo: {type: string, descriptions: {zh: 仓库。}}
        tag: {type: string, descriptions: {zh: 标签名。}}
        limit: {type: integer, descriptions: {zh: 最多条数。}}
      required: [repo]

  - name: gh-packages
    description: An organization's packages, or one package's versions.
    descriptions:
      zh: 组织的软件包，或某个包的版本列表。
    input_schema:
      type: object
      properties:
        org: {type: string, descriptions: {zh: 组织名。}}
        kind: {type: string, descriptions: {zh: container | npm | maven | rubygems | nuget}}
        package: {type: string, descriptions: {zh: 包名。}}
      required: [org]

  - name: gh-tag-create
    description: >-
      Create an ANNOTATED tag. `message` is required. MAINTAINER ONLY: a tag announces a version,
      and it is paired with gh-tag-delete so that whoever publishes can also withdraw.
    descriptions:
      zh: >-
        创建**附注**标签，`message` 必填。**仅负责人可用**：标签是对外宣告一个版本，
        与 gh-tag-delete 配对——能发布的才能撤回。
    input_schema:
      type: object
      properties:
        repo: {type: string, descriptions: {zh: 仓库。}}
        tag: {type: string, descriptions: {zh: 标签名，例如 v1.2.3。}}
        ref: {type: string, descriptions: {zh: 要打标签的 ref；留空为默认分支。}}
        message: {type: string, descriptions: {zh: 必填。标签说明。}}
      required: [repo, tag, message]
    requires: [repo.maintainer]

  - name: gh-tag-list
    description: Tags with the commit each points at.
    descriptions:
      zh: 标签列表，含各自指向的提交。
    input_schema:
      type: object
      properties:
        repo: {type: string, descriptions: {zh: 仓库。}}
      required: [repo]

  - name: gh-tag-show
    description: One tag's annotation — message, tagger, date.
    descriptions:
      zh: 单个标签的附注——说明、打标签的人、时间。
    input_schema:
      type: object
      properties:
        repo: {type: string, descriptions: {zh: 仓库。}}
        tag: {type: string, descriptions: {zh: 标签名。}}
      required: [repo, tag]

  - name: gh-tag-delete
    description: >-
      Delete a tag AND its release, unconditionally. IRREVERSIBLE.
    descriptions:
      zh: "删除标签**及其 release**，无条件。不可撤销。"
    input_schema:
      type: object
      properties:
        repo: {type: string, descriptions: {zh: 仓库。}}
        tag: {type: string, descriptions: {zh: 标签名。}}
      required: [repo, tag]
    requires: [repo.maintainer]

  - name: gh-repo-create
    description: >-
      Create a repository, under `org` or the authenticated user. Needs org.admin — creating a
      repository is an ORGANIZATION decision, and there is no repository yet to scope a grant to.
    descriptions:
      zh: >-
        创建仓库（在 `org` 下或当前用户名下）。需要 **org.admin**——创建仓库是**组织级**决定，
        而且仓库尚不存在，没有可授权的对象。
    input_schema:
      type: object
      properties:
        name: {type: string, descriptions: {zh: 仓库名。}}
        org: {type: string, descriptions: {zh: 组织名（可选）。}}
        description: {type: string, descriptions: {zh: 描述。}}
        private: {type: boolean, descriptions: {zh: 是否私有。}}
        auto_init: {type: boolean, descriptions: {zh: 是否创建初始提交。}}
      required: [name]
    requires: [org.admin]

  - name: gh-repo-rename
    description: Rename a repository. Breaks every existing clone, CI ref and doc link.
    descriptions:
      zh: 重命名仓库。会让所有既有 clone、CI 引用与文档链接失效。
    input_schema:
      type: object
      properties:
        repo: {type: string, descriptions: {zh: 当前仓库。}}
        name: {type: string, descriptions: {zh: 新名称。}}
      required: [repo, name]
    requires: [repo.maintainer]

  - name: gh-repo-delete
    description: Delete a repository. IRREVERSIBLE. `confirm` must equal the slug.
    descriptions:
      zh: 删除仓库。不可撤销。`confirm` 必须等于仓库全名。
    input_schema:
      type: object
      properties:
        repo: {type: string, descriptions: {zh: 要删除的仓库。}}
        confirm: {type: string, descriptions: {zh: 必须与 repo 完全相同。}}
      required: [repo, confirm]
    requires: [repo.maintainer]

  # ── CI：观察 ───────────────────────────────────────────────────────────
  - name: gh-workflow-list
    description: The repository's Actions workflows.
    descriptions:
      zh: 仓库的 Actions 工作流列表。
    input_schema:
      type: object
      properties:
        repo: {type: string, descriptions: {zh: 仓库。}}
      required: [repo]

  - name: gh-run-list
    description: Workflow runs, newest first.
    descriptions:
      zh: 工作流运行列表，最新的在前。
    input_schema:
      type: object
      properties:
        repo: {type: string, descriptions: {zh: 仓库。}}
        branch: {type: string, descriptions: {zh: 只显示该分支。}}
        event: {type: string, descriptions: {zh: push | pull_request | workflow_dispatch | ...}}
        limit: {type: integer, descriptions: {zh: 最多条数（默认 30）。}}
      required: [repo]

  - name: gh-run-jobs
    description: >-
      Jobs and PER-STEP status of a run — the LIVE view. A job's log exists only after it finishes.
    descriptions:
      zh: "某次运行的 job 与**逐步**状态——实时视图。job 的日志只在其结束后才有。"
    input_schema:
      type: object
      properties:
        repo: {type: string, descriptions: {zh: 仓库。}}
        run: {type: integer, descriptions: {zh: 来自 gh-run-list 的运行 id。}}
      required: [repo, run]

  - name: gh-run-log
    description: A run's logs, one section per job. Only after the jobs finish.
    descriptions:
      zh: 某次运行的日志，按 job 分段。仅在 job 结束后可用。
    input_schema:
      type: object
      properties:
        repo: {type: string, descriptions: {zh: 仓库。}}
        run: {type: integer, descriptions: {zh: 运行 id。}}
        lines: {type: integer, descriptions: {zh: 每个 job 最多行数（默认 500）。}}
      required: [repo, run]

  - name: gh-job-log
    description: >-
      The COMPLETE log of a FINISHED job — the runner's real log, with timestamps, ##[group]
      framing and every line the build produced. Only works after the job finishes; GitHub has no
      API for a running job (for that, see gh-check-log). Shows the LAST 200 lines by default, with
      the lines before them folded and counted. Use offset to read earlier parts, or grep to pull
      out matching lines from anywhere in the log.
    descriptions:
      zh: >-
        **已结束 job 的完整日志**——runner 的真实日志，含时间戳、`##[group]` 框架和构建产生的每一行。
        **只有 job 结束后才可用**；GitHub 没有查看运行中 job 的接口（要看实时的请用 gh-check-log）。
        默认只显示**最后 200 行**，之前的部分折叠并标出省略行数。用 offset 读更早的部分，用 grep
        从全文中提取匹配的行。
    input_schema:
      type: object
      properties:
        repo:
          type: string
          descriptions:
            zh: 仓库。
        job:
          type: integer
          description: Job id from gh-run-jobs.
          descriptions:
            zh: 来自 gh-run-jobs 的 job id。
        tail:
          type: integer
          description: Show only the last N lines (default 200).
          descriptions:
            zh: 只显示最后 N 行（默认 200）。
        offset:
          type: integer
          description: Start from this line (1-based). Overrides tail.
          descriptions:
            zh: 从第几行开始（1 起）。会覆盖 tail。
        limit:
          type: integer
          description: How many lines to show from the start position.
          descriptions:
            zh: 从起始位置显示多少行。
        grep:
          type: string
          description: Keep only lines containing this text; applied before the window.
          descriptions:
            zh: 只保留包含此文本的行；在取窗口之前过滤。
        ignore_case:
          type: boolean
          description: Case-insensitive grep.
          descriptions:
            zh: grep 时忽略大小写。
      required: [repo, job]

  - name: gh-check-log
    description: >-
      The LIVE view of a running job — but ONLY if the repository publishes it. This reads a check
      run's output.text, a field the workflow fills itself; nothing else can fill it, and GitHub
      exposes no other way to see a running job's output. THREE THINGS TO KNOW: (1) the repository
      must use the log-stream action, or this returns nothing; (2) the text is the output of THAT
      ACTION'S WRAPPED COMMAND, not the runner's standard log — no ##[group] framing, no setup
      notices, no colour; (3) it is TRUNCATED to 65535 characters, keeping the newest lines. For
      the complete log of a finished job, use gh-job-log.
    descriptions:
      zh: >-
        **运行中 job 的实时视图** —— 但**仅当该仓库主动发布时**才有内容。本工具读取 check run 的
        output.text，这个字段只能由 workflow 自己写入，GitHub 没有开放其他查看运行中 job 输出的接口。
        **三点必须知道**：(1) 仓库必须使用 log-stream action，否则本工具返回空；
        (2) 内容是**那个 action 所包装命令的输出**，不是 runner 的标准日志——没有 `##[group]` 框架、
        没有环境准备提示、没有颜色；(3) 内容**被截断**到 65535 字符，只保留最新部分。
        要看已结束 job 的完整日志，请用 gh-job-log。
    input_schema:
      type: object
      properties:
        repo:
          type: string
          descriptions:
            zh: 仓库。
        run:
          type: integer
          description: Run id from gh-run-list. Lists every published check run of that run.
          descriptions:
            zh: 来自 gh-run-list 的运行 id。会列出该运行下所有已发布的 check run。
        job:
          type: integer
          description: Job id from gh-run-jobs — reads that job's own check run.
          descriptions:
            zh: 来自 gh-run-jobs 的 job id——读取该 job 自己的 check run。
      required: [repo]

  - name: gh-artifacts
    description: The artifacts a run uploaded, flagging expired ones.
    descriptions:
      zh: 某次运行上传的产物，标出已过期的。
    input_schema:
      type: object
      properties:
        repo: {type: string, descriptions: {zh: 仓库。}}
        run: {type: integer, descriptions: {zh: 运行 id。}}
      required: [repo, run]

  - name: gh-artifact-download
    description: >-
      Download one artifact into the tenant's OBJECT STORAGE and return the object name. Refuses
      anything over max_bytes rather than truncating.
    descriptions:
      zh: >-
        下载单个产物存入租户**对象存储**并返回对象名。超过 max_bytes 会拒绝而不是截断。
    input_schema:
      type: object
      properties:
        repo: {type: string, descriptions: {zh: 仓库。}}
        artifact: {type: integer, descriptions: {zh: 来自 gh-artifacts 的产物 id。}}
        name: {type: string, descriptions: {zh: 用于生成对象名。}}
        max_bytes: {type: integer, descriptions: {zh: 超过则拒绝（默认 64 MiB）。}}
      required: [repo, artifact]

  - name: gh-run-rerun
    description: >-
      Rerun, defaulting to failed-only. A developer may rerun only its own runs; a maintainer may
      rerun anyone's.
    descriptions:
      zh: >-
        重跑，默认只重跑失败 job。开发者只能重跑自己触发的；负责人可以重跑任何人的。
    input_schema:
      type: object
      properties:
        repo: {type: string, descriptions: {zh: 仓库。}}
        run: {type: integer, descriptions: {zh: 运行 id。}}
        failed_only: {type: boolean, descriptions: {zh: 只重跑失败的（默认 true）。}}
      required: [repo, run]
    requires: [repo.maintainer]

  - name: gh-run-cancel
    description: >-
      Cancel a run. A REQUEST, not an instant stop. A developer may cancel only its own runs.
    descriptions:
      zh: "取消运行。是**请求**而非立即停止。开发者只能取消自己触发的。"
    input_schema:
      type: object
      properties:
        repo: {type: string, descriptions: {zh: 仓库。}}
        run: {type: integer, descriptions: {zh: 运行 id。}}
      required: [repo, run]
    requires: [repo.maintainer]

  - name: gh-run-dispatch
    description: >-
      Trigger a workflow_dispatch. Returns the run id it created.
    descriptions:
      zh: 触发 workflow_dispatch。返回所创建的 run id。
    input_schema:
      type: object
      properties:
        repo: {type: string, descriptions: {zh: 仓库。}}
        workflow: {type: string, descriptions: {zh: 工作流文件名或 id。}}
        ref: {type: string, descriptions: {zh: 分支或标签；留空为默认分支。}}
        inputs: {type: object, descriptions: {zh: 工作流声明的输入。}}
      required: [repo, workflow]
    requires: [repo.maintainer]

# Events this extension publishes, so a session can follow a repository and be woken when
# something ships.
#
# The channel is `github`, not `gitea`: the two extensions report different forges, and a
# subscriber following GitHub releases should not also receive tags from a self-hosted Gitea.
#
# WHY `release.` and not `tag.`: a TAG is a pointer a build might consume; a RELEASE is an
# announcement a human made. "Notice the new version" almost always means the release, and a tag
# pushed without one is not yet news.
channels:
  - name: github
    description: Repository events from GitHub.
    descriptions:
      zh: 来自 GitHub 的仓库事件。
    topics:
      - pattern: "release.<owner>/<repo>.<tag>"
        description: >-
          A release was published on a repository. Subscribe with "release.<owner>/<repo>.>" to
          follow one repository, or "release.<owner>/>" for every repository under an owner.
          Prereleases and drafts are not announced unless watch-prereleases is on.
        descriptions:
          zh: >-
            仓库发布了 release。用 "release.<owner>/<repo>.>" 订阅某个仓库，
            或用 "release.<owner>/>" 订阅某个 owner 下的所有仓库。
            预发布和草稿默认不宣告，除非开启 watch-prereleases。
        payload:
          type: object
          properties:
            repo: {type: string}
            tag: {type: string}
            name: {type: string}
            url: {type: string}
            ref: {type: string}
            prerelease: {type: boolean}
            published_at: {type: string}
