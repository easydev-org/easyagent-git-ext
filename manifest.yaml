id: git
version: 2.0
lifecycle: [deleted]

# git-ext: git operations against a repository inside a remote easyworker
# sandbox. Every tool runs `git` IN the sandbox (via the worker Execute RPC),
# so it needs no system git of its own. Each tool takes a `sandbox` (which
# worker) and a `path` (the repository directory in that sandbox); the path
# must be a git repository or the call is rejected.
tools:
  - name: git-clone
    description: >-
      Clone a repository into `path` in the sandbox and return its current branch + HEAD.
    descriptions:
      zh: >-
        将仓库克隆到沙箱内的 `path` 并返回当前分支与 HEAD。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: "Which sandbox to run in (see list-sandboxes). Omit when only one is configured."
          descriptions:
            zh: "在哪个沙箱中运行（见 list-sandboxes）。仅配置一个时可省略。"
        path:
          type: string
          description: "The git repository directory in the sandbox (relative to the workspace root)."
          descriptions:
            zh: "沙箱内 git 仓库目录（相对于工作区根）。"
        remote:
          type: string
          description: "The git URL."
          descriptions:
            zh: "git 地址。"
        branch:
          type: string
          description: "Branch to check out (default the remote default)."
          descriptions:
            zh: "要检出的分支（默认远端默认）。"
        depth:
          type: integer
          description: "Shallow depth (default 1; 0 = full)."
          descriptions:
            zh: "浅克隆深度（默认 1；0 表示完整）。"
      required: [sandbox, path, remote]
    required_config: [sandboxes, servers]
  - name: git-status
    description: >-
      Show the working-tree status of the repo at `path`.
    descriptions:
      zh: >-
        显示 `path` 处仓库的工作区状态。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: "Which sandbox to run in (see list-sandboxes). Omit when only one is configured."
          descriptions:
            zh: "在哪个沙箱中运行（见 list-sandboxes）。仅配置一个时可省略。"
        path:
          type: string
          description: "The git repository directory in the sandbox (relative to the workspace root)."
          descriptions:
            zh: "沙箱内 git 仓库目录（相对于工作区根）。"
      required: [sandbox, path]
    required_config: [sandboxes, servers]
  - name: git-log
    description: >-
      List recent commits of the repo at `path`.
    descriptions:
      zh: >-
        列出 `path` 处仓库的最近提交。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: "Which sandbox to run in (see list-sandboxes). Omit when only one is configured."
          descriptions:
            zh: "在哪个沙箱中运行（见 list-sandboxes）。仅配置一个时可省略。"
        path:
          type: string
          description: "The git repository directory in the sandbox (relative to the workspace root)."
          descriptions:
            zh: "沙箱内 git 仓库目录（相对于工作区根）。"
        limit:
          type: integer
          description: "Max commits (default 20)."
          descriptions:
            zh: "最大提交数（默认 20）。"
      required: [sandbox, path]
    required_config: [sandboxes, servers]
  - name: git-diff
    description: >-
      Show the diff of the repo at `path`.
    descriptions:
      zh: >-
        显示 `path` 处仓库的差异。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: "Which sandbox to run in (see list-sandboxes). Omit when only one is configured."
          descriptions:
            zh: "在哪个沙箱中运行（见 list-sandboxes）。仅配置一个时可省略。"
        path:
          type: string
          description: "The git repository directory in the sandbox (relative to the workspace root)."
          descriptions:
            zh: "沙箱内 git 仓库目录（相对于工作区根）。"
        staged:
          type: boolean
          description: "Diff the staged changes."
          descriptions:
            zh: "比较已暂存的变更。"
        from:
          type: string
          description: "From revision."
          descriptions:
            zh: "起始版本。"
        to:
          type: string
          description: "To revision."
          descriptions:
            zh: "目标版本。"
      required: [sandbox, path]
    required_config: [sandboxes, servers]
  - name: git-branch
    description: >-
      List branches of the repo at `path`.
    descriptions:
      zh: >-
        列出 `path` 处仓库的分支。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: "Which sandbox to run in (see list-sandboxes). Omit when only one is configured."
          descriptions:
            zh: "在哪个沙箱中运行（见 list-sandboxes）。仅配置一个时可省略。"
        path:
          type: string
          description: "The git repository directory in the sandbox (relative to the workspace root)."
          descriptions:
            zh: "沙箱内 git 仓库目录（相对于工作区根）。"
        remoteOnly:
          type: boolean
          description: "List remote-tracking branches."
          descriptions:
            zh: "列出远端跟踪分支。"
      required: [sandbox, path]
    required_config: [sandboxes, servers]
  - name: git-checkout
    description: >-
      Switch to a branch in the repo at `path`.
    descriptions:
      zh: >-
        切换到 `path` 处仓库的某个分支。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: "Which sandbox to run in (see list-sandboxes). Omit when only one is configured."
          descriptions:
            zh: "在哪个沙箱中运行（见 list-sandboxes）。仅配置一个时可省略。"
        path:
          type: string
          description: "The git repository directory in the sandbox (relative to the workspace root)."
          descriptions:
            zh: "沙箱内 git 仓库目录（相对于工作区根）。"
        branch:
          type: string
          description: "Branch name."
          descriptions:
            zh: "分支名。"
        create:
          type: boolean
          description: "Create it if absent."
          descriptions:
            zh: "不存在时创建。"
      required: [sandbox, path, branch]
    required_config: [sandboxes, servers]
  - name: git-add
    description: >-
      Stage paths in the repo at `path` (omit `paths` to stage all).
    descriptions:
      zh: >-
        暂存 `path` 处仓库的路径（省略 `paths` 则暂存全部）。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: "Which sandbox to run in (see list-sandboxes). Omit when only one is configured."
          descriptions:
            zh: "在哪个沙箱中运行（见 list-sandboxes）。仅配置一个时可省略。"
        path:
          type: string
          description: "The git repository directory in the sandbox (relative to the workspace root)."
          descriptions:
            zh: "沙箱内 git 仓库目录（相对于工作区根）。"
        paths:
          type: array
          description: "Paths to stage."
          descriptions:
            zh: "要暂存的路径。"
      required: [sandbox, path]
    required_config: [sandboxes, servers]
  - name: git-commit
    description: >-
      Commit in the repo at `path`.
    descriptions:
      zh: >-
        在 `path` 处仓库提交。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: "Which sandbox to run in (see list-sandboxes). Omit when only one is configured."
          descriptions:
            zh: "在哪个沙箱中运行（见 list-sandboxes）。仅配置一个时可省略。"
        path:
          type: string
          description: "The git repository directory in the sandbox (relative to the workspace root)."
          descriptions:
            zh: "沙箱内 git 仓库目录（相对于工作区根）。"
        message:
          type: string
          description: "Commit message."
          descriptions:
            zh: "提交信息。"
        all:
          type: boolean
          description: "Stage tracked changes first."
          descriptions:
            zh: "先暂存已跟踪文件的变更。"
        author:
          type: string
          description: "Author (Name <email>)."
          descriptions:
            zh: "作者（Name <email>）。"
      required: [sandbox, path, message]
    required_config: [sandboxes, servers]
  - name: git-pull
    description: >-
      Fetch + fast-forward the repo at `path` from origin.
    descriptions:
      zh: >-
        从 origin 拉取并快进 `path` 处仓库。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: "Which sandbox to run in (see list-sandboxes). Omit when only one is configured."
          descriptions:
            zh: "在哪个沙箱中运行（见 list-sandboxes）。仅配置一个时可省略。"
        path:
          type: string
          description: "The git repository directory in the sandbox (relative to the workspace root)."
          descriptions:
            zh: "沙箱内 git 仓库目录（相对于工作区根）。"
      required: [sandbox, path]
    required_config: [sandboxes, servers]
  - name: git-push
    description: >-
      Push the repo at `path` to origin.
    descriptions:
      zh: >-
        将 `path` 处仓库推送到 origin。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: "Which sandbox to run in (see list-sandboxes). Omit when only one is configured."
          descriptions:
            zh: "在哪个沙箱中运行（见 list-sandboxes）。仅配置一个时可省略。"
        path:
          type: string
          description: "The git repository directory in the sandbox (relative to the workspace root)."
          descriptions:
            zh: "沙箱内 git 仓库目录（相对于工作区根）。"
        branch:
          type: string
          description: "Branch to push (default current)."
          descriptions:
            zh: "要推送的分支（默认当前）。"
        force:
          type: boolean
          description: "Force-with-lease push."
          descriptions:
            zh: "强制（force-with-lease）推送。"
      required: [sandbox, path]
    required_config: [sandboxes, servers]
  - name: git-show
    description: >-
      Print a file's content at a revision in the repo at `path`.
    descriptions:
      zh: >-
        输出 `path` 处仓库某版本下某文件的内容。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: "Which sandbox to run in (see list-sandboxes). Omit when only one is configured."
          descriptions:
            zh: "在哪个沙箱中运行（见 list-sandboxes）。仅配置一个时可省略。"
        path:
          type: string
          description: "The git repository directory in the sandbox (relative to the workspace root)."
          descriptions:
            zh: "沙箱内 git 仓库目录（相对于工作区根）。"
        file:
          type: string
          description: "File path in the repo."
          descriptions:
            zh: "仓库内文件路径。"
        rev:
          type: string
          description: "Revision (default HEAD)."
          descriptions:
            zh: "版本（默认 HEAD）。"
      required: [sandbox, path, file]
    required_config: [sandboxes, servers]

config:
  - name: sandboxes
    type: list
    item_type: object
    min_items: 1
    kind: secret
    scope: global
    description: >-
      The easyworker sandboxes git runs IN. Every git-* tool takes a `sandbox`
      argument selecting one by name (the first is the default). git itself runs
      inside the sandbox. This value is a SECRET: it is never returned to a
      client.
    descriptions:
      zh: >-
        运行 git 的 easyworker 沙箱列表。每个 git-* 工具通过 `sandbox` 参数按名选择
        （默认第一个）。git 本身在沙箱内运行。该值为机密：永不返回给客户端。
    fields:
      - name: name
        type: string
        required: true
        description: Sandbox name, used to select it from the git-* tools.
        descriptions:
          zh: 沙箱名称，git-* 工具用它来选择。
      - name: url
        type: string
        format: uri
        required: true
        description: Worker HTTP base URL (e.g. http://worker.ns.svc.cluster.local:80).
        descriptions:
          zh: worker 的 HTTP 基础地址（如 http://worker.ns.svc.cluster.local:80）。
      - name: token
        type: string
        kind: secret
        required: true
        description: Worker access token. Masked in the console; never returned.
        descriptions:
          zh: worker 访问令牌。控制台中以掩码显示，永不回传。
      - name: os
        type: enum
        enum_values: [linux, windows, macos, android]
        default: linux
        description: Sandbox OS, for tooling that differs per platform.
        descriptions:
          zh: 沙箱操作系统，供按平台区分的工具使用。
  - name: servers
    type: string
    kind: secret
    scope: global
    description: >-
      JSON list of git hosts to authenticate against, each
      {"host":"github.com","kind":"github|gitlab|gitea|generic","token":"...","user":"..."}.
      A server is selected by the remote URL host; `kind` picks the HTTPS
      basic-auth username (github -> x-access-token, gitlab -> oauth2, gitea ->
      the real account). SECRET: never returned to a client.
    descriptions:
      zh: >-
        需要认证的 git 主机列表（JSON），每项
        {"host":"github.com","kind":"github|gitlab|gitea|generic","token":"...","user":"..."}。
        按 remote URL 的主机选择；`kind` 决定 HTTPS basic-auth 用户名（github → x-access-token，
        gitlab → oauth2，gitea → 真实账号）。机密：永不返回给客户端。
  - name: require-auth
    type: boolean
    scope: global
    default: false
    description: "When true, a remote host with no configured server is rejected instead of anonymous."
    descriptions:
      zh: "为 true 时，主机未配置服务器的 remote 会被拒绝，而不会匿名访问。"
