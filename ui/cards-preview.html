<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cards preview — gitdev-ext</title>
    <style>
      /* A preview of every card template, side by side.

         WHY THIS FILE EXISTS: a card is normally rendered inside a conversation the host is driving,
         and seeing all eight at once otherwise means making eight tool calls against a real
         repository. This page posts the same `easyagent:card-data` message the host posts, into a
         frame of the built bundle — so what it renders IS the shipped card, not a mock of it.

         It is not shipped in the image (see the Dockerfile, which copies `dist` only). */
      body {
        margin: 0;
        padding: 24px;
        font-family: system-ui, -apple-system, 'Segoe UI', 'PingFang SC', sans-serif;
        background: #f6f7f9;
        color: #1a1a1a;
      }
      h1 { font-size: 18px; margin: 0 0 4px; }
      .intro { color: #666; font-size: 13px; margin: 0 0 20px; max-width: 70ch; }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
        gap: 20px;
        align-items: start;
      }
      .slot { background: #fff; border: 1px solid #e2e4e8; border-radius: 10px; overflow: hidden; }
      .slot-head {
        display: flex;
        align-items: baseline;
        gap: 8px;
        padding: 10px 14px;
        border-bottom: 1px solid #eceef1;
        background: #fafbfc;
      }
      .slot-name { font-weight: 600; font-size: 13px; font-family: ui-monospace, monospace; }
      .slot-note { color: #777; font-size: 11px; }
      iframe { width: 100%; border: 0; display: block; background: #fff; }
    </style>
  </head>
  <body>
    <h1>Every card template, rendered by the shipped bundle</h1>
    <p class="intro">
      Each frame below loads <code>./index.html#/card/&lt;template&gt;</code> — the same document the
      host embeds — and is handed a payload over <code>postMessage</code>, exactly as the host does.
      The payloads use the field names the tools really emit.
    </p>
    <div class="grid" id="grid"></div>

    <script type="module">
      // The payloads, in the shape each tool returns. Field names match the tools: a card that
      // rendered nothing here would render nothing in a conversation.
      const cards = [
        {
          tool: 'git-file-list',
          note: 'the mirror: a directory',
          input: { remote: 'http://forgejo/agentdev/e2e.git', branch: 'main' },
          data: {
            branch: 'main',
            dir: '',
            count: 3,
            entries: [
              { path: 'README.md', name: 'README.md', dir: false, size: 7 },
              { path: 'src', name: 'src', dir: true, size: 0 },
              { path: 'walk-1793250357617363978.md', name: 'walk-1793250357617363978.md', dir: false, size: 36 },
            ],
          },
          output: 'README.md\nsrc\nwalk-1793250357617363978.md',
        },
        {
          tool: 'git-file-read',
          note: 'the mirror: one file',
          input: { remote: 'http://forgejo/agentdev/e2e.git', branch: 'main', path: 'README.md' },
          data: { path: 'README.md', branch: 'main', size: 7, content: '# e2e\n\n' },
          output: '1| # e2e',
        },
        {
          tool: 'git-file-patch',
          note: 'the mirror: one patch, one commit',
          input: { branch: 'feat/x', message: 'feat: add a note' },
          data: {
            commit: 'ec8338cb35c5a1f0e9d2b7c4a8f6e1d3b5c7a9e2',
            branch: 'feat/x',
            count: 2,
            changes: [
              { kind: 'add', path: 'NOTE.md' },
              { kind: 'update', path: 'README.md' },
            ],
          },
          output: 'created  NOTE.md\nupdated  README.md\n\n2 file(s) changed in one commit ec8338cb35c5',
        },
        {
          tool: 'git-sync-upstream',
          note: 'the mirror: fast-forward',
          input: { branch: 'main' },
          data: {
            branch: 'main',
            moved: true,
            before: '70ba7f7f145016b4fb0d0eb43a1a246a42698b3e',
            after: '93abf6318c36b4f908b4f373ed0d5b379f642661',
            upstream: 'https://github.com/easydev-org/test.git',
          },
          output: 'main fast-forwarded 70ba7f7f1450 -> 93abf6318c36',
        },
        {
          tool: 'gh-pr-files',
          note: 'a pull request: what it changes',
          input: { repo: 'easydev-org/test', issue_id: 3 },
          data: {
            additions: 5,
            deletions: 0,
            count: 1,
            files: [
              {
                Path: 'FLOW.md',
                Status: 'added',
                Additions: 5,
                Deletions: 0,
                PatchTruncated: false,
                PreviousPath: '',
              },
            ],
          },
          output: 'added  +5 -0  FLOW.md\n\n1 files, +5 -0',
        },
        {
          tool: 'gh-pr-diff',
          note: 'a pull request: the whole diff',
          input: { repo: 'easydev-org/test', issue_id: 3 },
          data: { truncated: false },
          output:
            'diff --git a/FLOW.md b/FLOW.md\nnew file mode 100644\nindex 0000000..3b18e51\n--- /dev/null\n+++ b/FLOW.md\n@@ -0,0 +1,5 @@\n+# Workspace flow\n+\n+second commit\n+\n+flow-055104',
        },
        {
          tool: 'gh-pr-checks',
          note: 'a pull request: CI and mergeability',
          input: { repo: 'easydev-org/test', issue_id: 3 },
          data: {
            state: 'success',
            sha: 'd915315b7c2a1e8f4d6b9c3a5e7f1d2b4c6a8e0f',
            mergeable: 'clean',
            checks: {
              Runs: [{ Name: 'build', Status: 'completed', Conclusion: 'success' }],
              Statuses: [{ Context: 'ci/circleci', State: 'success' }],
            },
          },
          output: 'CI: success\nmergeable: clean\n  build   completed/success\n  ci/circleci   status: success',
        },
        {
          tool: 'gh-issue-show',
          note: 'one issue',
          input: { repo: 'easydev-org/test', issue_id: 20 },
          data: { index: 20, title: 'e2e: issue tool probe', state: 'open', comments: [] },
          output: '#20 e2e: issue tool probe  [open]  (issue)\n\n  Created by the end-to-end test.',
        },
      ];

      const grid = document.getElementById('grid');

      for (const c of cards) {
        const slot = document.createElement('div');
        slot.className = 'slot';

        const head = document.createElement('div');
        head.className = 'slot-head';
        head.innerHTML = `<span class="slot-name"></span><span class="slot-note"></span>`;
        head.querySelector('.slot-name').textContent = c.tool;
        head.querySelector('.slot-note').textContent = c.note;

        const frame = document.createElement('iframe');
        frame.src = `./index.html#/card/${encodeURIComponent(c.tool)}`;
        // The frame reports the height it needs; without this every card would be cut off or
        // padded to a guess.
        window.addEventListener('message', (ev) => {
          const d = ev.data;
          if (ev.source !== frame.contentWindow) return;
          if (d?.type === 'easyagent:card-height' && typeof d.height === 'number') {
            frame.style.height = `${Math.max(80, d.height)}px`;
          }
          // The card asks for its data when it mounts.
          if (d?.type === 'easyagent:card-ready') {
            frame.contentWindow?.postMessage(
              {
                type: 'easyagent:card-data',
                tool: c.tool,
                input: c.input,
                data: c.data,
                output: c.output,
                error: c.error ?? '',
              },
              '*',
            );
          }
        });
        frame.style.height = '120px';

        slot.append(head, frame);
        grid.append(slot);
      }
    </script>
  </body>
</html>
