name: ci

on:
  push:
    branches: [main]
    # Tags too, or the image job below never runs: it is gated on a v* ref, and a push event that
    # filters branches only would never start this workflow for a tag.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # -race matters here: the release watchers run one goroutine per tenant and publish onto
      # the bus while the main loop mutates the started set.
      - run: go build ./...
      - run: go vet ./...
      - name: test
        run: go test -race ./...

  # The browser UI: types and a real build.
  #
  # Separate from `unit` on purpose. The Go job must stay fast and must not need Node, and a broken
  # frontend must not look like a broken backend — the failure line should say which half is wrong.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          # No npm cache: it is keyed on a lockfile, and a lockfile that does not exist yet fails the
          # whole job with "Some specified paths were not resolved, unable to cache dependencies"
          # before a single line of ours runs. The install is seconds; the cache is not worth a
          # failure mode that points at the wrong thing.
      - run: npm install --no-audit --no-fund
        working-directory: ui
      - name: types
        run: npm run check
        working-directory: ui
      # A build, not just a typecheck: this is what go:embed will serve, and a bundling error (a bad
      # base path, a missing import) only shows up here.
      - name: build
        run: npm run build
        working-directory: ui
      # The base path must match UISpec.Base in main.go or every asset 404s in the deployed image.
      - name: base path matches the mount point
        run: |
          set -euo pipefail
          grep -q 'base: *["'"'"']/ext/gitdev/["'"'"']' ui/vite.config.ts
          # main.go declares the mount point ONCE (`const uiBase = "/ext/gitdev"`), and UISpec.Base
          # references it, so the check is that the constant still says what Vite builds for. The
          # earlier grep looked for a literal in the UISpec struct — it broke the moment the value
          # became a constant, which is exactly the kind of coupling this check should not have.
          grep -q 'const uiBase = "/ext/gitdev"' cmd/gitdev-ext/main.go
          grep -q 'Base: *uiBase' cmd/gitdev-ext/main.go
          echo "vite base and uiBase agree"
          grep -o 'src="[^"]*"' ui/dist/index.html | head -5

  # The extension against a REAL broker and a REAL GitHub repository.
  #
  # The agent is NOT part of this: a tool call is a request on
  # `easybus.<tenant>.tool.call.<extId>.<tool>`, so the test plays the agent's part with the SDK's
  # own client.
  #
  # The clone target is a real repository rather than a fixture, because the tool under test IS git:
  # a stub would prove nothing about credentials, transport or ref handling — which is exactly where
  # this extension fails. A pull request cannot reach the token, so this runs on push and dispatch.
  live:
    runs-on: ubuntu-latest
    needs: unit
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: start nats
        run: docker compose -f .github/ci/compose.yaml up -d

      - name: wait for nats
        run: |
          set -uo pipefail
          for i in $(seq 1 60); do
            status="$(docker inspect -f '{{.State.Health.Status}}' ci-nats 2>/dev/null || echo missing)"
            if [ "$status" = "healthy" ]; then echo "nats healthy"; exit 0; fi
            sleep 2
          done
          echo "::error::nats never became healthy"
          docker inspect -f '{{json .State.Health}}' ci-nats || true
          docker logs ci-nats 2>&1 | tail -30 || true
          exit 1

      - name: live e2e (real GitHub)
        env:
          # THE NAMES HERE MUST MATCH WHAT THE TESTS READ. They used to be E2E_* while the tests read
          # GH_*, so every test skipped and the step passed by doing nothing — a "live" check that
          # proved nothing for as long as it existed. GH_E2E is the switch that makes a missing token
          # a failure rather than a skip.
          GH_E2E: "1"
          GH_TOKEN: ${{ secrets.E2E_GITHUB_TOKEN }}
          GH_E2E_REPO: easydev-org-test/test
          E2E_NATS_URL: nats://127.0.0.1:4222
        # ./interop/e2e is gone with the workspace: it drove git-ws-clone and the checkout tools, which
        # no longer exist. The live coverage that remains is in internal/tools — those tests talk to
        # the real GitHub API and need no local checkout, which is the point.
        run: go test ./internal/tools/ -run 'TestE2E' -v -count=1 -timeout 600s

      - name: dump nats logs on failure
        if: failure()
        run: docker compose -f .github/ci/compose.yaml logs --no-color

      - name: down
        if: always()
        run: docker compose -f .github/ci/compose.yaml down -v

  # EVERY TOOL, END TO END, THROUGH THE BUS.
  #
  # The `live` job above calls Registry directly. That proves a handler works and says nothing about
  # whether the extension would ever be ASKED: registration, permissions, argument deserialisation and
  # reply serialisation all live outside the handler. This job starts the real thing — the image built
  # from this commit, on a real NATS — and drives every registered tool over it.
  #
  # IT IS THE JOB THAT WOULD HAVE CAUGHT THREE REAL BUGS found while writing it: a GitHub credential
  # that never reached a push, a JSON shape the panel could not read, and a Config assembled by hand
  # that silently dropped a field.
  e2e:
    runs-on: ubuntu-latest
    needs: unit
    # NOT ON A PULL REQUEST. It writes to a real GitHub repository and a real forge, and a fork's PR
    # has no access to the secrets it needs anyway — a job that would always fail to authenticate is
    # a job that teaches people to ignore red builds.
    if: github.event_name != 'pull_request'
    # SIXTY. The image build alone takes ten to fifteen minutes on a runner with no layer cache, then
    # seven steps move a whole branch between two servers, each bounded at two minutes when a host is
    # unreachable. A cancelled run reports NOTHING, which is worse than a slow one — that is how this
    # number was chosen.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: start nats and the extension
        # THE TWO SERVICES THAT MUST BE REAL, AND NOT THE EXTENSION.
        #
        # NATS and Forgejo are the world this extension talks to, so they run as containers exactly as
        # a deployment would. The extension itself is a Go binary built from this checkout and started
        # below — building its IMAGE meant a `npm ci` + `vite build` + compile on a runner with no
        # layer cache, which took longer than the whole job's budget and cancelled runs before a
        # single tool was called. The image build is verified by the `image` job on both architectures.
        run: |
          docker compose -f .github/ci/compose.yaml -f .github/ci/compose.binary.yaml up -d

      - name: build and start the extension
        # `//go:embed all:ui` accepts an empty directory, so the binary compiles without the browser
        # bundle — and this suite never touches the UI. What it exercises is the bus.
        run: |
          set -uo pipefail
          go build -o /tmp/gitdev-ext ./cmd/gitdev-ext
          nohup /tmp/gitdev-ext >/tmp/gitdev.log 2>&1 &
          ls -la /tmp/gitdev-ext

      - name: wait for both to be healthy
        run: |
          set -uo pipefail
          # The two CONTAINERS, by docker health. The extension is a process this job started, so it is
          # checked by its own port rather than by a container state that does not exist.
          for svc in ci-nats ci-forge; do
            ok=0
            for i in $(seq 1 90); do
              status="$(docker inspect -f '{{.State.Health.Status}}' "$svc" 2>/dev/null || echo missing)"
              if [ "$status" = "healthy" ]; then echo "$svc healthy"; ok=1; break; fi
              sleep 2
            done
            if [ "$ok" -ne 1 ]; then
              echo "::error::$svc never became healthy"
              docker logs "$svc" 2>&1 | tail -40 || true
              exit 1
            fi
          done
          # THE EXTENSION ANSWERS ON ITS OWN PORT once it has REGISTERED — which is the moment the
          # tools become callable, so this is the readiness signal that matters.
          ok=0
          for i in $(seq 1 45); do
            if wget -q -O- http://127.0.0.1:8080/api/v1/version >/dev/null 2>&1; then
              echo "gitdev-ext answering"; ok=1; break
            fi
            sleep 2
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::the extension never answered"
            tail -60 /tmp/gitdev.log || true
            exit 1
          fi

      # THE MIRROR IS MADE HERE, ON EVERY RUN, AND THROWN AWAY AT THE END.
      #
      # A forge whose state survives between runs makes a suite that can pass because of what the last
      # one left behind: a branch that already exists, a tag from Tuesday, a repository that is no
      # longer empty. compose starts an EMPTY Forgejo each time; this step gives it an account, a token
      # and the repository the mirror tools will write to.
      - name: make a fresh mirror
        id: forge
        env:
          # THE UPSTREAM THIS MIRROR COPIES. The bootstrap seeds the mirror FROM it, because an
          # auto_init repository has a root commit of its own — one that shares no ancestor with the
          # upstream's, so the first sync is refused as a non-fast-forward and any branch cut from it
          # has "no history in common with main".
          GH_E2E_UPSTREAM: https://github.com/easydev-org-test/test.git
          GH_TOKEN: ${{ secrets.E2E_GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          out="$(go run ./cmd/e2e-all/bootstrap -url http://127.0.0.1:3000)"
          echo "$out"
          while IFS='=' read -r k v; do
            [ -n "$k" ] && echo "$k=$v" >> "$GITHUB_OUTPUT"
          done <<< "$out"

      # THE GITHUB TOKEN IS OPTIONAL, THE MIRROR IS NOT. Half this extension can be verified with no
      # GitHub credential at all (the six git-* tools against the forge above); the other half needs
      # one to write to a real repository. Without it the GitHub steps report themselves skipped,
      # which is honest — a green build that silently tested half the tools is not.
      - name: is a GitHub credential available?
        id: gh
        env:
          GH_TOKEN: ${{ secrets.E2E_GITHUB_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::no E2E_GITHUB_TOKEN — the GitHub half of the suite will be skipped"
            echo "have=false" >> "$GITHUB_OUTPUT"
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi

      - name: seed the configuration the extension reads
        env:
          # The mirror this run just made, not a deployment someone configured by hand.
          #
          # 127.0.0.1, BECAUSE THE EXTENSION NOW RUNS ON THE RUNNER rather than in the compose network.
          # `forge` — the service name — resolves only INSIDE containers, and using it here made every
          # git-* tool fail with `lookup forge on 127.0.0.53:53: server misbehaving`: a DNS error that
          # names nothing about the actual mistake. The forge's port is published to the runner, so the
          # address is the loopback one.
          E2E_SERVERS: >-
            [{"host":"127.0.0.1","kind":"gitea","api_url":"http://127.0.0.1:3000",
              "token":"${{ steps.forge.outputs.E2E_FORGE_TOKEN }}"}]
          GH_TOKEN: ${{ secrets.E2E_GITHUB_TOKEN }}
          # The watcher needs a repository to follow. Without it the extension starts its release
          # watcher with an empty list, which is legal but leaves that path unexercised.
          GH_E2E_REPO: easydev-org-test/test
        run: go run ./cmd/e2e-all/seed -nats nats://127.0.0.1:4222

      - name: call every tool
        env:
          # FROM THE MIRROR THIS RUN MADE. The account name and the repository name are both produced
          # by the bootstrap step, because the mirror's identity is the upstream's and only the bootstrap
          # knows which upstream this run used.
          GH_E2E_MIRROR: ${{ steps.forge.outputs.E2E_MIRROR_REPO }}
          # THE ADDRESS THE TOOLS ARE GIVEN. It has to be the SAME STRING the extension has in its
          # `servers` table above, because the tools build a remote URL from it and the extension
          # matches that URL's host against what it was configured with. Both are now the loopback
          # address, for the reason given beside E2E_SERVERS.
          GH_E2E_FORGE: http://127.0.0.1:3000
          # THE CI TOOLS TARGET THE THROWAWAY ORGANISATION TOO, even though that repository has no runs
          # to read yet.
          #
          # Pointing them at the real project would give them something to look at, but `gh-run-cancel`
          # and `gh-run-rerun` WRITE: excluding this run is not enough when the repository also has
          # other people's. A suite that cancels somebody's build to prove it can cancel is a suite
          # that will eventually cancel the wrong one. So the CI steps report themselves skipped until
          # the test repository has a workflow of its own.
          GH_E2E_CI_REPO: easydev-org-test/test
          GH_E2E_REPO: easydev-org-test/test
        # THE GITHUB HALF IS GATED ON A CREDENTIAL, the mirror half always runs. `-skip-github` tells
        # the suite to exercise the forge tools and report the GitHub ones as skipped-by-configuration
        # rather than failed — because "no token in this repository" is not a fault in the code.
        run: |
          if [ "${{ steps.gh.outputs.have }}" = "true" ]; then
            go run ./cmd/e2e-all -nats nats://127.0.0.1:4222
          else
            go run ./cmd/e2e-all -nats nats://127.0.0.1:4222 -skip-github
          fi

      - name: extension logs on failure
        if: failure()
        run: tail -100 /tmp/gitdev.log || true

      # WHAT THIS RUN COULD NOT TIDY UP. The suite deletes what it created on the way out, but a run
      # that is cancelled cannot — and that is how twenty-eight `e2e-scratch-*` repositories appeared
      # on the test organisation while this suite was being written.
      #
      # `always()` because the case it exists for is precisely the run that died. `-dry-run` FIRST and
      # its output is printed, so the log says what was about to go before anything goes; the pattern
      # is the suite's own prefix and nothing else.
      - name: sweep what a cancelled run left behind
        if: always()
        env:
          GH_TOKEN: ${{ secrets.E2E_GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "no token; nothing to sweep"
            exit 0
          fi
          go build -o /tmp/sweep ./cmd/e2e-all/sweep
          echo "--- would delete ---"
          /tmp/sweep -owner easydev-org-test -dry-run || true
          echo "--- deleting ---"
          /tmp/sweep -owner easydev-org-test || true

      - name: down
        if: always()
        run: docker compose -f .github/ci/compose.yaml down -v

  # The release image. Built ONLY from a tag: an image called `latest` that nobody decided to
  # publish is worse than no image at all, and this repository had no workflow before, so it had
  # no image and no tag either.
  #
  # ONE JOB PER ARCHITECTURE, each on a runner of that architecture.
  #
  # This used to be a single job with `platforms: linux/amd64,linux/arm64` under QEMU. Emulation is
  # 5-20x slower than native for anything CPU-bound, and this image runs `npm ci` + `vite build` for
  # the browser UI — so the arm64 half dominated the build for no benefit. GitHub hosts native arm64
  # runners, so there was never anything to emulate.
  image:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # No setup-qemu: there is nothing to emulate. buildx is still needed for the push-by-digest
      # flow that lets the two architectures be assembled into one manifest afterwards.
      - uses: docker/setup-buildx-action@v3

      - name: log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN is scoped to this repository and expires with the job: no long-lived
          # registry credential exists anywhere.
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed BY DIGEST, not by tag: two jobs writing the same tag would race, and whichever
      # finished last would silently replace the other's architecture.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          # Scoped per architecture: a cache written by the arm64 runner is useless to the amd64 one.
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          provenance: true
          sbom: true

      - name: record the digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
          echo "built ${{ matrix.platform }} -> $digest"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Assemble the per-architecture digests into ONE multi-arch manifest, and apply the tags there.
  #
  # Tagging here rather than in the build jobs is what makes a tag point at a COMPLETE image:
  # applying it earlier would briefly publish a tag resolving to a single architecture.
  image-merge:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    needs: image
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` follows the highest semver tag only, so a v0.x pre-release does not silently
      # become the default.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: create the manifest
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}

      - name: verify both architectures are present
        run: |
          set -euo pipefail
          # A merge that silently produced a single-arch manifest would still exit 0, so the result
          # is checked rather than assumed — this is the failure mode the whole split can introduce.
          #
          # Matched by PLATFORM NAME, not by number of entries: `provenance` and `sbom` each add an
          # `unknown/unknown` attestation manifest, so a correct multi-arch image lists FOUR entries.
          # An equality check on the count fails on a perfectly good image, which is what it did.
          first_tag="$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
          docker buildx imagetools inspect "$first_tag"
          got="$(docker buildx imagetools inspect "$first_tag" \
            | grep -oE '^ +Platform: +linux/[a-z0-9]+' | awk '{print $2}' | sort -u | tr '\n' ' ')"
          for want in linux/amd64 linux/arm64; do
            case " $got " in
              *" $want "*) ;;
              *) echo "::error::$first_tag is missing $want (has: ${got:-none})"; exit 1 ;;
            esac
          done
          echo "both architectures present in $first_tag: $got"
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
