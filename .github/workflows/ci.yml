name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Fast feedback: no services, no network. This is what runs on every push, so
  # it must stay quick enough that nobody is tempted to skip it.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # -race matters here: the tools run handlers concurrently and the worker
      # stub in the E2E writes a map from another goroutine.
      - run: go build ./...
      - run: go vet ./...
      - name: test
        run: go test -race ./internal/... ./...
      # yaml.safe_load accepts duplicate mapping keys, so a repeated env var passes
      # locally and only fails on the runner with "mapping key already defined".
      # Catching it here keeps that mistake local (it cost a CI round-trip once).
      - name: lint CI yaml (duplicate keys)
        run: |
          # The runner has python3 but not necessarily pyyaml; installing it is
          # cheap and keeps this check from silently doing nothing.
          python3 -m pip install --quiet pyyaml
          python3 .github/ci/check-yaml.py

  # Full workflow against a REAL Forgejo and a REAL NATS, both started by
  # docker compose inside the runner. Nothing is borrowed from a shared cluster:
  # the state is per-run, so a failure is reproducible and a pass is meaningful.
  e2e:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # `services:` cannot express Gitea's first-boot provisioning, so compose is
      # used instead: one file that also works for a developer locally.
      #
      # NOT `--wait`: that binds the step to the compose healthcheck and reports
      # only "process exited 1" when it fails, which says nothing. Starting
      # detached and polling the API in the next step keeps the reason visible
      # (and the next step prints the container logs when it gives up).
      - name: start gitea (+ nats for parity with a real deployment)
        run: docker compose -f .github/ci/compose.yaml up -d

      - name: wait for gitea api
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/v1/version >/dev/null 2>&1; then
              echo "gitea is up: $(curl -fsS http://127.0.0.1:3000/api/v1/version)"
              exit 0
            fi
            sleep 2
          done
          echo "gitea did not come up; container status:"; docker compose -f .github/ci/compose.yaml ps
          echo "logs:"; docker compose -f .github/ci/compose.yaml logs --no-color
          exit 1

      - name: provision user, token and scratch repo
        id: provision
        env:
          # SQLite is the CI database, so the email row can be flipped directly if
          # the CLI cannot express it. Without this, a push is refused with
          # "remote: Verify" and nothing says why.
          VERIFY_EMAIL_VIA_SQL: sqlite
        run: |
          set -euo pipefail
          # Credentials come back in a FILE: a bare value on stdout is parsed by
          # the runner as a workflow command and rejected with
          # "Invalid format '<token>'", which reads like a leak but is a protocol
          # collision. The USER is needed too — Gitea authenticates
          # <real-user>:<token> and rejects placeholders.
          creds="$RUNNER_TEMP/gitea-creds"
          .github/ci/provision.sh "$creds"
          # shellcheck disable=SC1090
          . "$creds"
          if [ -z "${GITEA_TOKEN:-}" ] || [ -z "${GITEA_USER:-}" ]; then
            echo "provision produced no credentials"; exit 1
          fi
          echo "::add-mask::$GITEA_TOKEN"
          {
            echo "GITEA_USER=$GITEA_USER"
            echo "GITEA_TOKEN<<CI_EOF"
            echo "$GITEA_TOKEN"
            echo "CI_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: build extension
        run: go build -o /tmp/gitea-ext ./cmd/gitea-ext

      - name: build nats-server
        run: |
          go install github.com/nats-io/nats-server/v2@latest
          cp "$(go env GOPATH)/bin/nats-server" /tmp/nats-server

      - name: e2e (real workflow)
        env:
          EASYBUS_NATS_SERVER_BIN: /tmp/nats-server
          E2E_EXT_BIN: /tmp/gitea-ext
          E2E_REMOTE: http://127.0.0.1:3000/agentdev/mrflow.git
          E2E_GITEA_HOST: 127.0.0.1
          E2E_GITEA_API: http://127.0.0.1:3000
          E2E_GITEA_USER: ${{ steps.provision.outputs.GITEA_USER }}
          E2E_GITEA_TOKEN: ${{ steps.provision.outputs.GITEA_TOKEN }}
        run: go test ./interop/mrflow/ -run TestMRWorkflow -v -timeout 600s

      - name: dump logs on failure
        if: failure()
        run: docker compose -f .github/ci/compose.yaml logs --no-color
