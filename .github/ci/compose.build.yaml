# Build the extension locally instead of pulling it.
#
# COMPOSE LETS AN OVERRIDE REPLACE ONE SERVICE'S `image:` WITH A `build:`, which is what a run on a
# branch needs: there is no published tag for a commit that has not been released, so the only honest
# thing to test is an image built from that commit. A tagged run uses the published image instead —
# the same bytes the deployment will get.
#
# The base file is what a deployment looks like; this one says "make the image here".
services:
  gitdev:
    image: gitdev-e2e:local
    build:
      context: ../..
      dockerfile: Dockerfile
